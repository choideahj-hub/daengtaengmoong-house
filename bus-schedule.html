<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>댕탱뭉 하우스 · 마을버스 시간표</title>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css"></noscript>
<style>
  :root{
    --bg:#F4FAF6;
    --surface:#FFFFFF;
    --ink:#1E2621;
    --ink-soft:#5B6B60;
    --muted:#96A69C;
    --line:#DCEAE1;
    --accent:#1F9D64;
    --accent-soft:#E3F7EC;
    --amber:#B7791F;
    --amber-soft:#FBF2E1;
    --red:#C23B32;
    --red-soft:#FBEAE8;
    --gray-soft:#EEF1EF;
    --gray-fg:#6B776F;
    --radius:20px;
    --shadow:0 6px 18px -6px rgba(31,157,100,.16), 0 2px 6px -2px rgba(30,38,33,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 80px 0;
  }
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 0;}

  header{margin-bottom:24px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;letter-spacing:.08em;color:var(--accent);
    text-transform:uppercase;font-weight:800;margin-bottom:10px;
    background:var(--accent-soft);padding:4px 11px;border-radius:100px;
  }
  h1{font-size:26px;font-weight:800;margin:0 0 6px;letter-spacing:-0.02em;}
  .sub{font-size:13px;color:var(--ink-soft);margin:0;line-height:1.6;}

  .now-clock{
    background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px 20px;margin-top:18px;text-align:center;
  }
  .now-clock-label{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.04em;margin-bottom:4px;}
  .now-clock-time{
    font-size:38px;font-weight:800;color:var(--ink);letter-spacing:.01em;
    font-variant-numeric:tabular-nums;line-height:1.2;
  }
  .now-clock-date{font-size:12.5px;color:var(--ink-soft);margin-top:4px;font-weight:600;}

  .selector-card{
    background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:20px 18px;margin-top:20px;
  }
  .field-group{padding:4px 0;}
  .field-group .label{font-size:12px;font-weight:800;color:var(--ink-soft);margin-bottom:9px;}
  .pill-row{display:flex;gap:8px;}
  .pill{
    flex:1;padding:11px 6px;border-radius:100px;border:1.5px solid var(--line);
    background:#fff;font-size:13.5px;font-weight:700;color:var(--ink-soft);
    cursor:pointer;transition:all .15s ease;text-align:center;
  }
  .pill:active{transform:scale(.97);}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .group-divider{
    border:none;border-top:1.5px dashed var(--line);margin:16px 0;
  }
  .time-input-row{margin-top:12px;}
  .time-input-row input[type="time"]{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;
    font-size:15px;font-family:inherit;background:#FBFCFD;color:var(--ink);
  }
  .time-input-row input[type="time"]:focus{outline:none;border-color:var(--accent);}

  /* Bus result list (plain card style) */
  .board-wrap{margin-top:20px;}
  .board-header{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:10px;padding:0 4px;
  }
  .board-title{font-size:13px;font-weight:800;color:var(--ink-soft);}
  .board-clock{
    font-size:12.5px;font-weight:700;color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .bus-row{
    background:var(--surface);border-radius:16px;box-shadow:var(--shadow);
    padding:14px 16px;margin-bottom:10px;
    border-left:5px solid var(--gray-soft);
  }
  .bus-row.status-ok{border-left-color:var(--accent);}
  .bus-row.status-hurry{border-left-color:var(--red);background:var(--red-soft);}
  .bus-row.status-skip{border-left-color:var(--muted);background:var(--gray-soft);}
  .bus-row.status-now{border-left-color:var(--red);background:var(--red-soft);}
  .bus-rank{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px;}
  .bus-row:first-child .bus-rank{color:var(--accent);}
  .bus-sentence{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;line-height:1.4;}
  .bus-sentence b{font-variant-numeric:tabular-nums;color:var(--accent);}
  .bus-meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .bus-eta{font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .urgent-tag{
    font-size:12px;font-weight:800;padding:4px 10px;border-radius:100px;
  }
  .urgent-tag.status-hurry{background:#fff;color:var(--red);border:1.5px solid var(--red);}
  .urgent-tag.status-skip{background:#fff;color:var(--gray-fg);border:1.5px solid var(--muted);}
  .urgent-tag.status-now{background:#fff;color:var(--red);border:1.5px solid var(--red);}

  .board-more-btn{
    width:100%;padding:11px;border-radius:100px;
    border:1.5px dashed var(--line);background:none;color:var(--ink-soft);
    font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s ease;
  }
  .board-more-btn:hover{border-color:var(--accent);color:var(--accent);}
  .board-end{
    background:var(--surface);border-radius:16px;box-shadow:var(--shadow);
    text-align:center;padding:34px 10px;
  }
  .board-end .emoji{font-size:32px;display:block;margin-bottom:10px;}
  .board-end .msg{font-size:15px;font-weight:800;color:var(--ink);}

  .section-label{
    display:flex;align-items:center;justify-content:space-between;
    margin:26px 0 12px;cursor:pointer;user-select:none;
  }
  .section-label h2{font-size:14.5px;font-weight:800;margin:0;}
  .section-label .toggle-icon{
    font-size:12px;color:var(--muted);transition:transform .2s ease;
  }
  .section-label .toggle-icon.open{transform:rotate(180deg);}
  .full-table-wrap{display:none;}
  .full-table-wrap.open{display:block;}
  .selection-banner{
    background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700;
    padding:10px 14px;border-radius:12px;margin-bottom:12px;
  }
  .full-table{
    background:var(--surface);border-radius:16px;box-shadow:var(--shadow);
    padding:16px;display:flex;flex-wrap:wrap;gap:8px;
  }
  .time-chip{
    font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;
    padding:6px 10px;border-radius:8px;background:#F3F5F8;color:var(--muted);
  }
  .time-chip.past{opacity:.4;text-decoration:line-through;}
  .time-chip.next{background:var(--accent);color:#fff;}

  .footer-note{
    text-align:center;font-size:11.5px;color:var(--muted);margin-top:30px;line-height:1.7;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">🏠 댕탱뭉 하우스 · 챕터 02</div>
    <h1>성동15번 마을버스 🚌</h1>
    <p class="sub">금호대우아파트 · 금호역 정류장 시간표 (동호운수 ☎ 02-2297-8103)</p>
  </header>

  <div class="now-clock">
    <div class="now-clock-label">⏰ 현재 시각</div>
    <div class="now-clock-time" id="liveClock">--:--:--</div>
    <div class="now-clock-date" id="liveDate"></div>
  </div>

  <div class="selector-card">
    <div class="field-group">
      <div class="label">🚏 출발 정류장 (여기서 타요)</div>
      <div class="pill-row" id="stopPills">
        <button class="pill" data-stop="daewoo">🏢 금호대우아파트</button>
        <button class="pill" data-stop="station">🚇 금호역</button>
      </div>
    </div>

    <hr class="group-divider">

    <div class="field-group">
      <div class="label">평일 / 휴일</div>
      <div class="pill-row" id="dayPills">
        <button class="pill" data-day="weekday">💼 평일</button>
        <button class="pill" data-day="holiday">☀️ 휴일</button>
      </div>
    </div>

    <hr class="group-divider">

    <div class="field-group">
      <div class="label">기준 시간</div>
      <div class="pill-row" id="modePills">
        <button class="pill" data-mode="now">⏱️ 지금</button>
        <button class="pill" data-mode="custom">🕐 시간 선택</button>
      </div>
      <div class="time-input-row" id="timeInputRow" style="display:none;">
        <input type="time" id="customTime">
      </div>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board-header">
      <span class="board-title" id="boardTitle">금호대우아파트 · 평일</span>
      <span class="board-clock" id="boardClock">--:--:--</span>
    </div>
    <div id="boardBody"></div>
  </div>

  <div class="section-label" id="fullTableToggle">
    <h2>🕐 전체 시간표</h2>
    <span class="toggle-icon" id="fullTableIcon">▾</span>
  </div>
  <div class="full-table-wrap" id="fullTableWrap">
    <div class="selection-banner" id="selectionBanner"></div>
    <div class="full-table" id="fullTable"></div>
  </div>

  <p class="footer-note">2024년 5월 20일(월) 첫차부터 적용된 시간표 기준이에요<br>실제 도착 시간은 도로 상황에 따라 달라질 수 있어요</p>
</div>

<script>
const SCHEDULE = {
  daewoo: {
    label: '금호대우아파트',
    emoji: '🏢',
    routeEmoji: '🏢→🚇',
    weekday: ["6:20","6:33","6:46","6:59","7:12","7:24","7:36","7:48","8:00","8:12","8:24","8:36","8:48","9:00","9:13","9:25","9:50","10:15","10:40","11:05","11:30","11:43","11:56","12:09","12:22","12:35","12:48","13:01","13:14","13:27","13:40","13:53","14:06","14:19","14:32","14:45","14:58","15:10","15:35","16:00","16:25","16:50","17:15","17:28","17:41","17:54","18:07","18:20","18:33","18:46","18:59","19:12","19:25","19:38","19:51","20:04","20:17","20:30","20:45","21:00","21:15","21:30","21:45","22:00","22:15","22:30","22:45","23:00"],
    holiday: ["5:55","6:20","6:45","7:10","7:35","8:00","8:25","8:50","9:15","9:40","10:05","10:30","10:55","11:08","11:21","11:34","11:47","12:00","12:13","12:26","12:39","12:52","13:05","13:18","13:31","13:44","13:57","14:10","14:23","14:36","14:49","15:02","15:15","15:40","16:05","16:25","16:50","17:15","17:28","17:41","17:54","18:07","18:20","18:33","18:46","18:59","19:12","19:25","19:38","19:51","20:04","20:30","20:45","21:20","21:45","22:10","22:35","23:00"]
  },
  station: {
    label: '금호역',
    emoji: '🚇',
    routeEmoji: '🚇→🏢',
    weekday: ["6:10","6:36","6:49","7:02","7:15","7:28","7:40","7:52","8:04","8:16","8:28","8:40","8:52","9:04","9:16","9:29","9:41","10:05","10:30","10:55","11:20","11:46","11:59","12:12","12:25","12:38","12:51","13:04","13:17","13:30","13:43","13:56","14:09","14:22","14:35","14:48","15:01","15:14","15:26","15:50","16:15","16:40","17:05","17:31","17:44","17:57","18:10","18:23","18:36","18:49","19:02","19:15","19:28","19:41","19:54","20:07","20:20","20:33","20:45","21:00","21:15","21:30","21:45","22:00","22:15","22:30","22:45","22:55","23:10"],
    holiday: ["6:10","6:35","7:00","7:25","7:50","8:15","8:40","9:05","9:30","9:55","10:20","10:45","11:10","11:24","11:37","11:50","12:03","12:16","12:29","12:42","12:55","13:08","13:21","13:34","13:47","14:00","14:13","14:26","14:39","14:52","15:05","15:18","15:30","15:55","16:20","16:40","17:05","17:31","17:44","17:57","18:10","18:23","18:36","18:49","19:02","19:15","19:28","19:41","19:54","20:07","20:20","20:45","21:10","21:35","22:00","22:25","22:50","23:10"]
  }
};

const $ = (id) => document.getElementById(id);

let state = {
  stop: 'daewoo',
  day: 'weekday',
  mode: 'now',
  customTime: '',
  showMore: false
};

function getKSTNow(){
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
}

function isKSTWeekend(){
  const d = getKSTNow().getDay();
  return d === 0 || d === 6;
}

function parseHM(str){
  const [h, m] = str.split(':').map(Number);
  return h * 60 + m;
}

function getReferenceMinutes(){
  if(state.mode === 'custom' && state.customTime){
    const [h, m] = state.customTime.split(':').map(Number);
    return h * 60 + m;
  }
  const now = getKSTNow();
  return now.getHours() * 60 + now.getMinutes();
}

function initDefaults(){
  state.day = isKSTWeekend() ? 'holiday' : 'weekday';
  const now = getKSTNow();
  state.customTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}

function syncPillUI(){
  document.querySelectorAll('#stopPills .pill').forEach(p=>{
    p.classList.toggle('active', p.dataset.stop === state.stop);
  });
  document.querySelectorAll('#dayPills .pill').forEach(p=>{
    p.classList.toggle('active', p.dataset.day === state.day);
  });
  document.querySelectorAll('#modePills .pill').forEach(p=>{
    p.classList.toggle('active', p.dataset.mode === state.mode);
  });
  $('timeInputRow').style.display = state.mode === 'custom' ? 'block' : 'none';
  $('customTime').value = state.customTime;
}

function computeUpcoming(){
  const times = SCHEDULE[state.stop][state.day];
  const refMin = getReferenceMinutes();
  const upcoming = times
    .map(t => ({ label: t.length === 4 ? '0'+t : t, mins: parseHM(t) }))
    .filter(t => t.mins >= refMin)
    .sort((a,b)=> a.mins - b.mins);
  return { upcoming, refMin };
}

const RANK_LABELS = ['가장 빠른 버스','두 번째로 빠른 버스','세 번째로 빠른 버스','네 번째로 빠른 버스','다섯 번째로 빠른 버스'];

function statusFor(diff, isTop){
  if(!isTop) return { cls:'ok', tag:'' };
  if(diff <= 0) return { cls:'now', tag:'🚨 지금 바로 타야 해요!!' };
  if(diff <= 4) return { cls:'skip', tag:'🐢 이건 놓칠 것 같아요, 다음 버스가 더 여유로워요' };
  if(diff <= 7) return { cls:'hurry', tag:'⚡ 지금 출발하면 탈 수 있어요!' };
  return { cls:'ok', tag:'' };
}

function renderBoard(){
  const meta = SCHEDULE[state.stop];
  const dayLabel = state.day === 'weekday' ? '💼 평일' : '☀️ 휴일';
  $('boardTitle').textContent = `${meta.routeEmoji} ${meta.label} · ${dayLabel}`;

  const now = getKSTNow();
  if(state.mode === 'now'){
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    $('boardClock').textContent = `${hh}:${mm}:${ss}`;
  } else {
    $('boardClock').textContent = `🕐 ${state.customTime} 기준`;
  }

  const { upcoming, refMin } = computeUpcoming();
  const body = $('boardBody');

  if(upcoming.length === 0){
    body.innerHTML = `<div class="board-end"><span class="emoji">🚌</span><span class="msg">오늘 운행 종료</span></div>`;
    return;
  }

  const shown = state.showMore ? upcoming.slice(0,5) : upcoming.slice(0,3);
  let html = '';
  shown.forEach((t, i)=>{
    const diff = t.mins - refMin;
    const isTop = i === 0;
    const status = statusFor(diff, isTop);
    const etaText = diff <= 0 ? '곧 출발' : `${diff}분 후`;
    html += `
      <div class="bus-row status-${status.cls}">
        <div class="bus-rank">${RANK_LABELS[i]}</div>
        <div class="bus-sentence">${meta.routeEmoji} ${meta.label}에서 <b>${t.label}</b> 출발합니다</div>
        <div class="bus-meta-row">
          <span class="bus-eta">⏳ ${etaText}</span>
          ${status.tag ? `<span class="urgent-tag status-${status.cls}">${status.tag}</span>` : ''}
        </div>
      </div>
    `;
  });

  if(upcoming.length > 3){
    html += state.showMore
      ? `<button class="board-more-btn" id="boardMoreBtn">▴ 접기</button>`
      : `<button class="board-more-btn" id="boardMoreBtn">▾ 2개 더 보기</button>`;
  }

  body.innerHTML = html;
  const moreBtn = $('boardMoreBtn');
  if(moreBtn){
    moreBtn.addEventListener('click', ()=>{
      state.showMore = !state.showMore;
      renderBoard();
    });
  }
}

function renderFullTable(){
  const meta = SCHEDULE[state.stop];
  const dayLabel = state.day === 'weekday' ? '💼 평일' : '☀️ 휴일';
  $('selectionBanner').textContent = `📍 지금 보고 있는 시간표: ${meta.routeEmoji} ${meta.label} · ${dayLabel}`;

  const times = SCHEDULE[state.stop][state.day];
  const refMin = getReferenceMinutes();
  const upcomingMins = times.map(parseHM).filter(m => m >= refMin).sort((a,b)=>a-b);
  const nextThree = new Set(upcomingMins.slice(0,3));

  $('fullTable').innerHTML = times.map(t=>{
    const mins = parseHM(t);
    const label = t.length === 4 ? '0'+t : t;
    let cls = 'time-chip';
    if(mins < refMin) cls += ' past';
    else if(nextThree.has(mins)) cls += ' next';
    return `<span class="${cls}">${label}</span>`;
  }).join('');
}

function renderLiveClock(){
  const now = getKSTNow();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  $('liveClock').textContent = `${hh}:${mm}:${ss}`;
  const days = ['일','월','화','수','목','금','토'];
  const dayLabel = isKSTWeekend() ? '휴일' : '평일';
  $('liveDate').textContent = `${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]}) · 오늘은 ${dayLabel}이에요`;
}

function renderAll(){
  syncPillUI();
  renderBoard();
  renderFullTable();
}

document.querySelectorAll('#stopPills .pill').forEach(p=>{
  p.addEventListener('click', ()=>{ state.stop = p.dataset.stop; state.showMore=false; renderAll(); });
});
document.querySelectorAll('#dayPills .pill').forEach(p=>{
  p.addEventListener('click', ()=>{ state.day = p.dataset.day; state.showMore=false; renderAll(); });
});
document.querySelectorAll('#modePills .pill').forEach(p=>{
  p.addEventListener('click', ()=>{ state.mode = p.dataset.mode; state.showMore=false; renderAll(); });
});
$('customTime').addEventListener('change', (e)=>{
  state.customTime = e.target.value;
  renderAll();
});
$('fullTableToggle').addEventListener('click', ()=>{
  const wrap = $('fullTableWrap');
  const icon = $('fullTableIcon');
  wrap.classList.toggle('open');
  icon.classList.toggle('open');
});

function init(){
  try{
    initDefaults();
    renderAll();
    renderLiveClock();
    setInterval(()=>{
      renderLiveClock();
      if(state.mode === 'now') renderBoard();
    }, 1000);
  }catch(err){
    document.body.innerHTML = '<div style="padding:40px 20px;font-family:sans-serif;color:#C23B32;">화면을 불러오는 중 오류가 발생했어요.<br><br>' + String(err && err.message ? err.message : err) + '</div>';
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
