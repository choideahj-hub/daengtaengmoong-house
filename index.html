<style>

<script src="https://unpkg.com/solarlunar/dist/solarlunar.min.js"></script>
<script>
function $(id){ return document.getElementById(id); }
function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getKSTToday(){
  const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
  d.setHours(0,0,0,0);
  return d;
}

// ---- 정기지출 캘린더 위젯 (읽기 전용, Firestore에서 조회) ----

function maskAccount(account){
  if(!account) return '';
  const digitCount = (account.match(/\d/g) || []).length;
  if(digitCount <= 4) return account;
  let toMask = digitCount - 4;
  let out = '';
  for(const ch of account){
    if(/\d/.test(ch) && toMask > 0){
      out += '•';
      toMask--;
    } else {
      out += ch;
    }
  }
  return out;
}

function ledgerDdayFor(day, today){
  const dim = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
  const clampedDay = Math.min(day, dim);
  let diff = clampedDay - today.getDate();
  if(diff < 0){
    const daysInNextMonth = new Date(today.getFullYear(), today.getMonth()+2, 0).getDate();
    const nextClamped = Math.min(day, daysInNextMonth);
    diff = (dim - today.getDate()) + nextClamped;
  }
  return diff;
}

async function renderLedgerWidget(){
  const el = document.getElementById('ledgerWidget');
  try{
    // module script가 아직 로드/실행 중일 수 있어 잠깐 대기
    let tries = 0;
    while(!window.firestoreLoadLedger && tries < 50){
      await new Promise(r => setTimeout(r, 100));
      tries++;
    }
    if(!window.firestoreLoadLedger) throw new Error('저장소 연결 준비가 안 됐어요');
    const data = await window.firestoreLoadLedger();
    const entries = (data && Array.isArray(data.entries)) ? data.entries : [];
    const active = entries.filter(e => !e.expired);
    if(active.length === 0){
      el.innerHTML = '<div style="padding:16px;color:var(--ink-soft);font-size:12.5px;">등록된 정기지출이 없어요.</div>';
      return;
    }
    const today = getKSTToday();
    const computed = active.map(e => ({ ...e, diffDays: ledgerDdayFor(e.day, today) }))
      .sort((a,b)=> a.diffDays - b.diffDays);
    const top = computed.slice(0, 3);
    el.innerHTML = top.map(e => `
      <div class="anniv-row">
        <span class="anniv-emoji">💳</span>
        <div class="anniv-body">
          <div class="anniv-name">
            <span class="anniv-owner o-${e.owner || '댕'}">${e.owner || '댕'}</span>
            ${e.name || e.card || '정기지출'}
          </div>
          <div class="anniv-meta">${e.card || ''} · 매월 ${e.day}일</div>
          <div class="anniv-meta" style="color:var(--accent);font-weight:700;">🏦 ${maskAccount(e.account) || '통장 정보 없음'}</div>
        </div>
        <span class="anniv-dday ${e.diffDays===0?'today':''}">${e.diffDays===0?'D-DAY':'D-'+e.diffDays}</span>
      </div>
    `).join('');
  }catch(err){
    el.innerHTML = '<div style="padding:16px;color:#C23B32;font-size:12.5px;">정기지출 정보를 불러오지 못했어요.<br>(' + (err && err.message ? err.message : err) + ')</div>';
  }
}

// ---- 댕탱 캘린더 위젯 (읽기 전용, 등록/수정은 calendar.html에서) ----

// 시작일 기준 "몇째 주 무슨 요일"인지 계산 (calendar.html과 동일한 규칙: 마지막 7일 이내면 '마지막 주'로 취급)
function calWidgetMonthlyAnchor(sy, sm, sd){
  const weekday = new Date(sy, sm - 1, sd).getDay();
  const dim = new Date(sy, sm, 0).getDate();
  const isLast = (dim - sd) < 7;
  return { weekday, position: isLast ? 'last' : Math.ceil(sd / 7) };
}
function calWidgetNthWeekdayDate(year, month, weekday, position){
  if(position === 'last'){
    let d = new Date(year, month, 0);
    while(d.getDay() !== weekday) d.setDate(d.getDate() - 1);
    return d.getDate();
  }
  let d = new Date(year, month - 1, 1);
  while(d.getDay() !== weekday) d.setDate(d.getDate() + 1);
  d.setDate(d.getDate() + (position - 1) * 7);
  if(d.getMonth() !== month - 1) return null;
  return d.getDate();
}

function calendarOccursOn(ev, dateObj){
  const [sy, sm, sd] = ev.date.split('-').map(Number);
  const startObj = new Date(sy, sm - 1, sd);
  if(dateObj < startObj) return false;
  if(ev.repeatEnd){
    const [ey, em, ed] = ev.repeatEnd.split('-').map(Number);
    const endObj = new Date(ey, em - 1, ed);
    if(dateObj > endObj) return false;
  }
  if(ev.repeat === 'none' || !ev.repeat){
    if(ev.endDate && ev.endDate >= ev.date){
      const iso = `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;
      return iso >= ev.date && iso <= ev.endDate;
    }
    return dateObj.getFullYear() === sy && dateObj.getMonth() + 1 === sm && dateObj.getDate() === sd;
  }
  if(ev.repeat === 'daily'){
    return true;
  }
  if(ev.repeat === 'weekly'){
    return dateObj.getDay() === startObj.getDay();
  }
  if(ev.repeat === 'monthly'){
    if(ev.monthlyMode === 'weekday'){
      const anchor = calWidgetMonthlyAnchor(sy, sm, sd);
      const target = calWidgetNthWeekdayDate(dateObj.getFullYear(), dateObj.getMonth() + 1, anchor.weekday, anchor.position);
      return target !== null && dateObj.getDate() === target;
    }
    const dim = new Date(dateObj.getFullYear(), dateObj.getMonth() + 1, 0).getDate();
    return dateObj.getDate() === Math.min(sd, dim);
  }
  if(ev.repeat === 'yearly'){
    return dateObj.getMonth() + 1 === sm && dateObj.getDate() === sd;
  }
  if(ev.repeat === 'counter'){
    return true; // 카운터는 매일 표시됨 (D+N 라벨로 구분)
  }
  if(ev.repeat === 'yearly-lunar'){
    if(typeof solarLunar === 'undefined' || !ev.lunarMonth || !ev.lunarDay) return false;
    const SL = solarLunar.lunar2solar ? solarLunar : solarLunar.default;
    const lMonth = ev.lunarMonth, lDay = ev.lunarDay, isLeap = !!ev.lunarIsLeap;
    function solarFor(y){
      let r = SL.lunar2solar(y, lMonth, lDay, isLeap);
      if((!r || r === -1) && isLeap) r = SL.lunar2solar(y, lMonth, lDay, false);
      return r;
    }
    for(const guessYear of [dateObj.getFullYear() - 1, dateObj.getFullYear()]){
      const r = solarFor(guessYear);
      if(r && r.cYear === dateObj.getFullYear() && r.cMonth === dateObj.getMonth() + 1 && r.cDay === dateObj.getDate()) return true;
    }
    return false;
  }
  return false;
}

async function renderCalendarWidget(){
  const el = document.getElementById('calendarWidget');
  try{
    let tries = 0;
    while(!window.firestoreLoadCalendar && tries < 50){
      await new Promise(r => setTimeout(r, 100));
      tries++;
    }
    if(!window.firestoreLoadCalendar) throw new Error('저장소 연결 준비가 안 됐어요');
    const data = await window.firestoreLoadCalendar();
    const events = (data && Array.isArray(data.events)) ? data.events : [];
    const today = getKSTToday();
    const items = [];
    for(let i = 0; i < 14; i++){
      const d = new Date(today);
      d.setDate(d.getDate() + i);
      events.forEach(ev => {
        if(calendarOccursOn(ev, d)) items.push({ ev, dateObj: d, diffDays: i });
      });
    }
    items.sort((a, b) => {
      if(a.diffDays !== b.diffDays) return a.diffDays - b.diffDays;
      const aHas = a.ev.time ? 1 : 0, bHas = b.ev.time ? 1 : 0;
      if(aHas !== bHas) return aHas - bHas; // 시간 없는(하루종일) 게 먼저
      if(a.ev.time !== b.ev.time) return (a.ev.time || '').localeCompare(b.ev.time || '');
      const tagP = ev => ev.annivTag ? 0 : (ev.expenseTag ? 1 : 2); // 기념일 > 정기지출 > 그 외
      return tagP(a.ev) - tagP(b.ev);
    });
    const top = items.slice(0, 10);
    if(top.length === 0){
      el.innerHTML = '<div style="padding:16px;color:var(--ink-soft);font-size:12.5px;">이번 주엔 등록된 일정이 없어요.</div>';
      return;
    }
    el.innerHTML = top.map(it => {
      const label = it.diffDays === 0 ? 'D-DAY' : 'D-' + it.diffDays;
      const dateLabel = `${it.dateObj.getMonth()+1}월 ${it.dateObj.getDate()}일`;
      const ownerTag = (it.ev.owner && it.ev.owner !== '공용') ? `<span class="anniv-owner o-${it.ev.owner}">${it.ev.owner}</span> ` : '';
      const expenseTag = it.ev.expenseTag ? `<span class="anniv-owner tag-expense">💳 정기지출</span> ` : '';
      const annivTag = it.ev.annivTag ? `<span class="anniv-owner tag-anniv">🎉 기념일</span> ` : '';
      let counterLabel = '';
      if(it.ev.repeat === 'counter'){
        const [sy, sm, sd] = it.ev.date.split('-').map(Number);
        const startObj = new Date(sy, sm - 1, sd);
        const diff = Math.round((it.dateObj - startObj) / 86400000) + 1;
        counterLabel = ` · D+${diff}`;
      }
      return `
      <div class="anniv-row">
        <span class="anniv-emoji">${it.ev.emoji || '📌'}</span>
        <div class="anniv-body">
          <div class="anniv-name">${ownerTag}${expenseTag}${annivTag}${escapeHtml(it.ev.title)}</div>
          <div class="anniv-meta">${dateLabel}${it.ev.time ? ' · ' + it.ev.time : ''}${counterLabel}</div>
        </div>
        <span class="anniv-dday ${it.diffDays===0?'today':''}">${label}</span>
      </div>`;
    }).join('');
  }catch(err){
    el.innerHTML = '<div style="padding:16px;color:#C23B32;font-size:12.5px;">일정을 불러오지 못했어요.</div>';
  }
}

// ---- 가정 메모지 (사야할 거 / 사고 싶은 거 등 자유메모, 담당별 색상 구분) ----
// 팝업 없이 메모지 위에서 바로 타이핑 → 포커스 아웃(blur)되면 자동 저장.

let MEMOS = [];

function genMemoId(){ return 'm' + Date.now() + Math.floor(Math.random()*100000); }

async function loadMemos(){
  try{
    let tries = 0;
    while(!window.firestoreLoadMemos && tries < 50){
      await new Promise(r => setTimeout(r, 100));
      tries++;
    }
    if(!window.firestoreLoadMemos) throw new Error('저장소 연결 준비가 안 됐어요');
    const data = await window.firestoreLoadMemos();
    MEMOS = (data && Array.isArray(data.notes)) ? data.notes : [];
  }catch(err){
    MEMOS = [];
  }
}

// 메모 저장 요청을 한 줄로 세워서 순서대로 처리 (동시에 여러 저장이 나가면 늦게 도착한 게
// 먼저 도착한 최신 내용을 덮어써버리는 문제가 있었음 — 이걸 막기 위한 큐).
let memoSaveChain = Promise.resolve();

async function saveMemosToFirestore(){
  const task = memoSaveChain.then(async () => {
    try{
      await window.firestoreSaveMemos(MEMOS); // 실행 시점의 최신 MEMOS를 보냄
      return true;
    }catch(e){
      alert('⚠️ 메모 저장에 실패했어요!\n\n' + (e.message || '') + '\n\n방금 한 작업은 저장되지 않았어요.');
      return false;
    }
  });
  memoSaveChain = task.catch(() => {}); // 실패해도 큐 자체는 계속 이어지게
  return task;
}

// 예전 방식(순수 텍스트, 줄바꿈 문자)으로 저장된 메모를 표시용 HTML로 변환.
// richText:true로 저장된 메모는 이미 HTML이라 그대로 씀 (이중 이스케이프 방지).
function textToHtml(text){
  return escapeHtml(text || '').replace(/\n/g, '<br>');
}

function renderMemoScroll(){
  const el = document.getElementById('memoScroll');
  const OWNERS = ['댕', '탱', '미정'];
  el.innerHTML = MEMOS.map(m => {
    const owner = m.owner || '미정';
    const displayHtml = m.richText ? (m.text || '') : textToHtml(m.text || '');
    const dotsHtml = OWNERS.map(o => `<button class="owner-dot dot-${o}${o===owner?' active':''}" data-id="${m.id}" data-owner="${o}" title="${o}"></button>`).join('');
    return `
    <div class="memo-note owner-${owner}" data-id="${m.id}">
      <div class="memo-note-top">
        <div class="memo-owner-picker">${dotsHtml}</div>
        <div class="memo-note-actions">
          <button class="memo-bold-btn" data-id="${m.id}">B</button>
          <button class="memo-delete-btn" data-id="${m.id}">×</button>
        </div>
      </div>
      <div class="memo-textarea" contenteditable="true" data-id="${m.id}" data-placeholder="예: 우유, 계란 사기">${displayHtml}</div>
    </div>
  `;
  }).join('') + `<div class="memo-add-card" id="memoAddBtn">+</div>`;

  el.querySelectorAll('.memo-textarea').forEach(box => {
    box.addEventListener('blur', () => saveMemoText(box.dataset.id, box.innerHTML));
    box.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
    });
  });
  el.querySelectorAll('.owner-dot').forEach(dot => {
    dot.addEventListener('click', () => saveMemoField(dot.dataset.id, 'owner', dot.dataset.owner));
  });
  el.querySelectorAll('.memo-bold-btn').forEach(btn => {
    // mousedown에서 미리 막아둬야 contenteditable의 선택 영역이 풀리지 않고 볼드가 먹음
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => {
      const box = el.querySelector(`.memo-textarea[data-id="${btn.dataset.id}"]`);
      box.focus();
      document.execCommand('bold');
    });
  });
  el.querySelectorAll('.memo-delete-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteMemo(btn.dataset.id));
  });
  document.getElementById('memoAddBtn').addEventListener('click', addNewMemo);
}

// 담당(owner)만 바꿔서 저장 — 항상 값이 있으므로 비어있는지 검사할 필요 없음.
async function saveMemoField(id, field, value){
  const idx = MEMOS.findIndex(m => m.id === id);
  if(idx === -1) return;

  const backup = JSON.parse(JSON.stringify(MEMOS));
  MEMOS[idx] = { ...MEMOS[idx], [field]: value };
  renderMemoScroll();
  const ok = await saveMemosToFirestore();
  if(!ok){ MEMOS = backup; renderMemoScroll(); }
}

// 서식(볼드 등) 포함 내용을 저장. 내용이 비어있는 새 메모는 저장하지 않고 그냥 지움.
async function saveMemoText(id, html){
  const idx = MEMOS.findIndex(m => m.id === id);
  if(idx === -1) return;

  const isNew = !!MEMOS[idx]._isNew;
  const plainCheck = html.replace(/<[^>]*>/g, '').trim();

  if(!plainCheck){
    if(isNew){
      MEMOS.splice(idx, 1);
      renderMemoScroll();
    }
    return;
  }

  MEMOS[idx] = { ...MEMOS[idx], text: html, richText: true };
  delete MEMOS[idx]._isNew;
  const backup = JSON.parse(JSON.stringify(MEMOS.map(m => { const c = {...m}; delete c._isNew; return c; })));
  const ok = await saveMemosToFirestore();
  if(!ok){
    MEMOS = backup;
    renderMemoScroll();
  }
}

async function deleteMemo(id){
  const idx = MEMOS.findIndex(m => m.id === id);
  if(idx === -1) return;
  if(MEMOS[idx].text && !confirm('이 메모를 삭제할까요? 되돌릴 수 없어요.')) return;

  const backup = JSON.parse(JSON.stringify(MEMOS));
  MEMOS.splice(idx, 1);
  renderMemoScroll();
  const ok = await saveMemosToFirestore();
  if(!ok){ MEMOS = backup; renderMemoScroll(); }
}

function addNewMemo(){
  MEMOS.push({ id: genMemoId(), text: '', owner: '미정', _isNew: true });
  renderMemoScroll();
  const el = document.getElementById('memoScroll');
  const newTa = el.querySelector('.memo-textarea:last-of-type');
  if(newTa) newTa.focus();
}

async function initWidgets(){
  renderCalendarWidget();
  await loadMemos();
  renderMemoScroll();
  document.getElementById('moreChaptersToggle').addEventListener('click', ()=>{
    const el = document.getElementById('moreChaptersList');
    const icon = document.getElementById('moreChaptersIcon');
    const isOpen = el.style.display !== 'none';
    el.style.display = isOpen ? 'none' : 'flex';
    icon.classList.toggle('open', !isOpen);
  });
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initWidgets);
} else {
  initWidgets();
}
</script>
