<style>
  :root{
    --bg:#FFF8F3;

    --ink-soft:#8A776C;

    background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:8px;display:flex;flex-direction:column;gap:2px;

  .anniv-emoji{font-size:22px;flex-shrink:0;}
  .anniv-body{flex:1;min-width:0;}
  .anniv-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px;}
  .anniv-meta{font-size:11px;color:var(--ink-soft);}
  .anniv-owner{

  .anniv-dday{

  }

<script src="https://unpkg.com/solarlunar/dist/solarlunar.min.js"></script>
<script>
const EVENTS = [
  { name: '결혼기념일', owner: '우리', date: '2025-05-25', type: 'anniversary', emoji: '💍' },
  { name: '댕 생일', owner: '댕', date: '1994-03-01', type: 'birthday', emoji: '🎂' },
  { name: '탱 생일', owner: '탱', date: '1993-08-04', type: 'birthday', emoji: '🎂' },
  { name: '뭉 생일', owner: '뭉', date: '2018-09-19', type: 'birthday', emoji: '🐾' },
  { name: '댕탱 사귄 날', owner: '우리', date: '2018-12-21', type: 'dating', emoji: '💕' },
  { name: '아버지 생신', owner: '댕', date: '1963-08-26', type: 'lunar-birthday', emoji: '🎂' },
  { name: '어머니 생신', owner: '댕', date: '1968-12-04', type: 'lunar-birthday', emoji: '🎂' },
  { name: '아버지 생신', owner: '탱', date: '1964-03-18', type: 'lunar-birthday', emoji: '🎂' },
  { name: '어머니 생신', owner: '탱', date: '1967-01-19', type: 'lunar-birthday', emoji: '🎂' },
];

function getKSTToday(){
  const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
  d.setHours(0,0,0,0);
  return d;
}

function computeEvent(ev, today){
  if(ev.type === 'lunar-birthday'){
    return computeLunarBirthday(ev, today);
  }
  const [origY, origM, origD] = ev.date.split('-').map(Number);
  let year = today.getFullYear();
  let next = new Date(year, origM - 1, origD);
  next.setHours(0,0,0,0);
  if(next < today){
    year += 1;
    next = new Date(year, origM - 1, origD);
    next.setHours(0,0,0,0);
  }
  const diffDays = Math.round((next - today) / (1000*60*60*24));
  const count = year - origY;

  let countLabel = '';
  if(ev.type === 'birthday') countLabel = `${count}번째 생일`;
  else if(ev.type === 'anniversary') countLabel = `${count}주년`;
  else if(ev.type === 'dating') countLabel = `사귄 지 ${count}년`;

  return { ...ev, diffDays, countLabel, dateLabel: `${next.getMonth()+1}월 ${next.getDate()}일` };
}

function computeLunarBirthday(ev, today){
  const SL = (typeof solarLunar !== 'undefined' && solarLunar.solar2lunar) ? solarLunar : solarLunar.default;
  const [origY, origM, origD] = ev.date.split('-').map(Number);
  // 생신(양력)을 음력으로 한 번 환산 - 평생 고정값
  const birthLunar = SL.solar2lunar(origY, origM, origD);
  const lMonth = birthLunar.lMonth;
  const lDay = birthLunar.lDay;
  const isLeap = !!birthLunar.isLeap;

  function solarForYear(y){
    let r = SL.lunar2solar(y, lMonth, lDay, isLeap);
    if((!r || r === -1) && isLeap){
      // 그 해에 윤달이 없으면 평달로 대체
      r = SL.lunar2solar(y, lMonth, lDay, false);
    }
    return r;
  }

  let year = today.getFullYear();
  let s = solarForYear(year);
  let next = new Date(s.cYear, s.cMonth - 1, s.cDay);
  next.setHours(0,0,0,0);
  if(next < today){
    year += 1;
    s = solarForYear(year);
    next = new Date(s.cYear, s.cMonth - 1, s.cDay);
    next.setHours(0,0,0,0);
  }
  const diffDays = Math.round((next - today) / (1000*60*60*24));
  const count = year - origY;
  const solarBirthLabel = `양력생일 ${origY}.${String(origM).padStart(2,'0')}.${String(origD).padStart(2,'0')}`;
  const lunarLabel = `음력 ${lMonth}월 ${lDay}일${isLeap ? '(윤달)' : ''} · ${solarBirthLabel}`;

  return {
    ...ev,
    diffDays,
    countLabel: `${count}번째 생신`,
    dateLabel: `${next.getMonth()+1}월 ${next.getDate()}일`,
    lunarLabel
  };
}

function ddayLabel(diff){
  return diff === 0 ? 'D-DAY' : 'D-' + diff;
}

function renderAnnivWidget(){
  try{
    const today = getKSTToday();
    const computed = EVENTS.map(ev => computeEvent(ev, today)).sort((a,b)=> a.diffDays - b.diffDays);
    const top = computed.slice(0, 3);
    document.getElementById('annivWidget').innerHTML = top.map(ev => `
      <div class="anniv-row">
        <span class="anniv-emoji">${ev.emoji}</span>
        <div class="anniv-body">
          <div class="anniv-name">
            <span class="anniv-owner o-${ev.owner}">${ev.owner}</span>
            ${ev.name}
          </div>
          <div class="anniv-meta">${ev.dateLabel}${ev.lunarLabel ? ' (' + ev.lunarLabel + ')' : ''} · ${ev.countLabel}</div>
        </div>
        <span class="anniv-dday ${ev.diffDays===0?'today':''}">${ddayLabel(ev.diffDays)}</span>
      </div>
    `).join('');
  }catch(err){
    document.getElementById('annivWidget').innerHTML = '<div style="padding:16px;color:#C23B32;font-size:12.5px;">기념일을 불러오지 못했어요.</div>';
  }
}

// ---- 정기지출 캘린더 위젯 (읽기 전용, Firestore에서 조회) ----

function maskAccount(account){
  if(!account) return '';
  const digitCount = (account.match(/\d/g) || []).length;
  if(digitCount <= 4) return account;
  let toMask = digitCount - 4;
  let out = '';
  for(const ch of account){
    if(/\d/.test(ch) && toMask > 0){
      out += '•';
      toMask--;
    } else {
      out += ch;
    }
  }
  return out;
}

function ledgerDdayFor(day, today){
  const dim = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
  const clampedDay = Math.min(day, dim);
  let diff = clampedDay - today.getDate();
  if(diff < 0){
    const daysInNextMonth = new Date(today.getFullYear(), today.getMonth()+2, 0).getDate();
    const nextClamped = Math.min(day, daysInNextMonth);
    diff = (dim - today.getDate()) + nextClamped;
  }
  return diff;
}

async function renderLedgerWidget(){
  const el = document.getElementById('ledgerWidget');
  try{
    // module script가 아직 로드/실행 중일 수 있어 잠깐 대기
    let tries = 0;
    while(!window.firestoreLoadLedger && tries < 50){
      await new Promise(r => setTimeout(r, 100));
      tries++;
    }
    if(!window.firestoreLoadLedger) throw new Error('저장소 연결 준비가 안 됐어요');
    const data = await window.firestoreLoadLedger();
    const entries = (data && Array.isArray(data.entries)) ? data.entries : [];
    const active = entries.filter(e => !e.expired);
    if(active.length === 0){
      el.innerHTML = '<div style="padding:16px;color:var(--ink-soft);font-size:12.5px;">등록된 정기지출이 없어요.</div>';
      return;
    }
    const today = getKSTToday();
    const computed = active.map(e => ({ ...e, diffDays: ledgerDdayFor(e.day, today) }))
      .sort((a,b)=> a.diffDays - b.diffDays);
    const top = computed.slice(0, 3);
    el.innerHTML = top.map(e => `
      <div class="anniv-row">
        <span class="anniv-emoji">💳</span>
        <div class="anniv-body">
          <div class="anniv-name">
            <span class="anniv-owner o-${e.owner || '댕'}">${e.owner || '댕'}</span>
            ${e.name || e.card || '정기지출'}
          </div>
          <div class="anniv-meta">${e.card || ''} · 매월 ${e.day}일</div>
          <div class="anniv-meta" style="color:var(--accent);font-weight:700;">🏦 ${maskAccount(e.account) || '통장 정보 없음'}</div>
        </div>
        <span class="anniv-dday ${e.diffDays===0?'today':''}">${e.diffDays===0?'D-DAY':'D-'+e.diffDays}</span>
      </div>
    `).join('');
  }catch(err){
    el.innerHTML = '<div style="padding:16px;color:#C23B32;font-size:12.5px;">정기지출 정보를 불러오지 못했어요.<br>(' + (err && err.message ? err.message : err) + ')</div>';
  }
}

function initWidgets(){
  renderLedgerWidget();
  renderAnnivWidget();
  document.getElementById('moreChaptersToggle').addEventListener('click', ()=>{
    const el = document.getElementById('moreChaptersList');
    const icon = document.getElementById('moreChaptersIcon');
    const isOpen = el.style.display !== 'none';
    el.style.display = isOpen ? 'none' : 'flex';
    icon.classList.toggle('open', !isOpen);
  });
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initWidgets);
} else {
  initWidgets();
}
</script>
