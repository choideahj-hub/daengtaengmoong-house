<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>댕탱 기프티콘함</title>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css"></noscript>
<style>
  :root{
    --bg:#FFF8F3;
    --surface:#FFFFFF;
    --ink:#4A3B34;
    --ink-soft:#8A776C;
    --muted:#C4B2A6;
    --line:#F3E4D8;
    --accent:#FF8FA0;
    --accent-soft:#FFE7EC;
    --accent2:#6FCFC0;
    --accent2-soft:#E1F7F2;
    --amber:#D9A441;
    --amber-soft:#FBF0DC;
    --red:#C23B32;
    --red-soft:#FBEAE8;
    --gray-soft:#F0EFEA;
    --radius:20px;
    --shadow:0 6px 18px -6px rgba(255,143,160,.22), 0 2px 6px -2px rgba(74,59,52,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  input, select, textarea{font-size:16px;}
  body{
    background:
      radial-gradient(circle at 8% 4%, #FFEFF2 0%, transparent 40%),
      radial-gradient(circle at 96% 12%, #E9F9F4 0%, transparent 38%),
      var(--bg);
    color:var(--ink);
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 70px 0;
  }
  .wrap{max-width:640px;margin:0 auto;padding:22px 16px 0;}

  /* Setup screen */
                
  header{margin-bottom:16px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;letter-spacing:.08em;color:var(--accent);
    text-transform:uppercase;font-weight:800;margin-bottom:8px;
    background:var(--accent-soft);padding:4px 11px;border-radius:100px;
  }
  h1{font-size:24px;font-weight:800;margin:0 0 4px;letter-spacing:-0.02em;}
  .sub{font-size:12.5px;color:var(--ink-soft);margin:0;line-height:1.6;}

  .add-btn{
    width:100%;margin-top:14px;padding:14px;border-radius:100px;
    border:2px dashed #FFC4D0;background:var(--accent-soft);color:var(--accent);
    font-size:13.5px;font-weight:800;cursor:pointer;
  }

  .pill-row{display:flex;gap:6px;margin-top:14px;}
  .pill{
    flex:1;padding:9px 6px;border-radius:100px;border:1.5px solid var(--line);
    background:#fff;font-size:12.5px;font-weight:700;color:var(--ink-soft);
    cursor:pointer;transition:all .15s ease;text-align:center;
  }
  .pill.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  .section-label{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;}
  .section-label h2{font-size:13.5px;font-weight:800;margin:0;}
  .section-label .hint{font-size:11px;color:var(--muted);font-weight:700;}

  .gift-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .gift-card{
    background:var(--surface);border-radius:18px;box-shadow:var(--shadow);
    overflow:hidden;cursor:pointer;border:3px solid transparent;
  }
  .gift-card.urgent{border-color:var(--red);}
  .gift-card.soon{border-color:var(--amber);}
  .gift-card.expired{opacity:.55;}
  .gift-thumb{
    position:relative;width:100%;aspect-ratio:1/1;background-size:contain;background-repeat:no-repeat;background-position:center;
    background-color:var(--gray-soft);
  }
  .gift-dday{
    position:absolute;top:8px;left:8px;font-size:13px;font-weight:800;color:#fff;
    background:var(--accent2);padding:5px 12px;border-radius:100px;
    box-shadow:0 3px 8px -2px rgba(0,0,0,.35);
  }
  .gift-dday.urgent{background:var(--red);}
  .gift-dday.soon{background:var(--amber);}
  .gift-dday.expired{background:var(--muted);}
  .used-stamp{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(74,59,52,.4);
  }
  .used-stamp span{
    border:3px solid #fff;color:#fff;font-weight:800;font-size:15px;
    padding:6px 14px;border-radius:10px;transform:rotate(-12deg);
    letter-spacing:.05em;
  }
  .gift-info{padding:10px 12px;}
  .gift-brand{font-size:10.5px;font-weight:800;color:var(--accent);margin-bottom:2px;}
  .gift-name{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  .empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:13px;grid-column:1/-1;}
  .empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px;}

  /* Modals */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(74,59,52,.45);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--surface);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;
    border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    animation:slideup .2s ease;
  }
  @media(min-width:540px){
    .modal-backdrop{align-items:center;}
    .modal{border-radius:24px;}
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal h3{margin:0 0 16px;font-size:16px;font-weight:800;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-bottom:5px;}
  .field input{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;
    font-family:inherit;background:#FFFCFA;color:var(--ink);
  }
  .field input:focus{outline:none;border-color:var(--accent);}
  .img-preview{
    width:100%;aspect-ratio:1/1;border-radius:14px;background:var(--gray-soft);
    background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:12.5px;margin-bottom:10px;overflow:hidden;
  }
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .btn{flex:1;padding:12px;border-radius:100px;border:none;font-size:14px;font-weight:800;cursor:pointer;}
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.ghost{background:var(--gray-soft);color:var(--ink-soft);}
  .btn.danger{background:var(--red-soft);color:var(--red);}
  .btn.use{background:var(--accent2);color:#fff;}
  .btn:disabled{opacity:.5;}

  /* Viewer modal */
  .viewer-img{width:100%;border-radius:16px;margin-bottom:14px;display:block;}
  .viewer-title{font-size:16px;font-weight:800;margin-bottom:2px;}
  .viewer-brand{font-size:12px;color:var(--accent);font-weight:800;margin-bottom:10px;}
  .viewer-meta-row{display:flex;justify-content:space-between;align-items:center;
    background:var(--gray-soft);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;}
  .viewer-dday-badge{font-weight:800;padding:4px 10px;border-radius:100px;color:#fff;}
  .viewer-dday-badge.urgent{background:var(--red);}
  .viewer-dday-badge.soon{background:var(--amber);}
  .viewer-dday-badge.expired{background:var(--muted);}
  .viewer-dday-badge.ok{background:var(--accent2);}

  .footer-note{text-align:center;font-size:11px;color:var(--muted);margin-top:28px;line-height:1.7;}
  .backup-row{display:flex;gap:8px;margin-top:22px;justify-content:center;}
  .backup-link{
    background:none;border:none;color:var(--muted);font-size:11px;font-weight:700;
    cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:6px 4px;
  }
  .backup-link:hover{color:var(--ink-soft);}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:100px;
    font-size:12.5px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<script>
const IMGBB_API_KEY = 'a6f5457d7a2d46e75af40a9575f7857d';

let gifticons = [];
let filter = 'active';
let editingId = null;
let viewingId = null;
let pendingImageData = null;

const $ = (id) => document.getElementById(id);

function getKSTToday(){
  const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
  d.setHours(0,0,0,0);
  return d;
}
function daysUntil(dateStr){
  const today = getKSTToday();
  const [y,m,d] = dateStr.split('-').map(Number);
  const target = new Date(y, m-1, d);
  target.setHours(0,0,0,0);
  return Math.round((target - today) / (1000*60*60*24));
}
function ddayLabel(diff){
  if(diff < 0) return `만료 D+${Math.abs(diff)}`;
  if(diff === 0) return 'D-DAY';
  return 'D-' + diff;
}
function statusClass(diff){
  if(diff < 0) return 'expired';
  if(diff <= 3) return 'urgent';
  if(diff <= 7) return 'soon';
  return 'ok';
}
function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- Firebase Firestore storage (no login, no token in source) ----

async function loadGifticons(){
  try{
    const data = await window.firestoreLoad();
    gifticons = (data && Array.isArray(data.gifticons)) ? data.gifticons : [];
  }catch(err){
    document.body.innerHTML = '<div style="padding:40px 20px;font-family:sans-serif;color:#C23B32;">데이터를 불러오지 못했어요.<br><br>' + String(err && err.message ? err.message : err) + '</div>';
    return;
  }
  try{
    render();
  }catch(err){
    document.body.innerHTML = '<div style="padding:40px 20px;font-family:sans-serif;color:#C23B32;">화면을 그리는 중 오류가 발생했어요.<br><br>' + String(err && err.message ? err.message : err) + '</div>';
  }
}

async function saveGifticons(){
  try{
    await window.firestoreSave({ gifticons });
    return true;
  }catch(e){
    alert('⚠️ 저장에 실패했어요!\n\n' + (e.message || '') + '\n\n방금 한 작업은 저장되지 않았어요.');
    return false;
  }
}

// ---- Image resize ----
function resizeImage(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('이미지를 읽지 못했어요'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽지 못했어요'));
    reader.readAsDataURL(file);
  });
}

// ---- Image hosting (imgbb) ----
// jsonblob 용량 한도를 피하기 위해, 실제 사진은 imgbb에 올리고 링크만 저장함
async function uploadToImgbb(dataUrl){
  const base64 = dataUrl.split(',')[1];
  const formData = new FormData();
  formData.append('key', IMGBB_API_KEY);
  formData.append('image', base64);
  const res = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
  const data = await res.json();
  if(!data.success){
    throw new Error(data.error && data.error.message ? data.error.message : '이미지 업로드에 실패했어요');
  }
  return data.data.url;
}

// pendingImageData가 이번에 새로 고른 사진(base64)이면 imgbb에 업로드해서 URL로 바꾸고,
// 이미 호스팅된 URL(수정 시 그대로 둔 경우)이면 그대로 사용
async function ensureImageUrl(pending){
  if(pending && pending.startsWith('data:')){
    return await uploadToImgbb(pending);
  }
  return pending;
}


// ---- Render ----
function render(){
  document.querySelectorAll('#filterPills .pill').forEach(p=>{
    p.classList.toggle('active', p.dataset.filter === filter);
  });
  renderGrid();
}

function renderGrid(){
  let list;
  if(filter === 'used'){
    list = gifticons.filter(g => g.used).sort((a,b)=> (b.usedAt||'').localeCompare(a.usedAt||''));
    $('listTitle').textContent = '사용완료';
  } else if(filter === 'expired'){
    list = gifticons.filter(g => !g.used && daysUntil(g.expiry) < 0).sort((a,b)=> a.expiry.localeCompare(b.expiry));
    $('listTitle').textContent = '기간만료';
  } else {
    list = gifticons.filter(g => !g.used && daysUntil(g.expiry) >= 0).sort((a,b)=> a.expiry.localeCompare(b.expiry));
    $('listTitle').textContent = '보유 중인 기프티콘';
  }
  $('listCountHint').textContent = list.length ? `${list.length}개` : '';

  const grid = $('giftGrid');
  if(list.length === 0){
    grid.innerHTML = `<div class="empty"><b>해당하는 기프티콘이 없어요</b>${filter==='active' ? '위 버튼으로 추가해보세요.' : ''}</div>`;
    return;
  }

  grid.innerHTML = list.map(g=>{
    const diff = daysUntil(g.expiry);
    const cls = g.used ? '' : statusClass(diff);
    return `
      <div class="gift-card ${cls}" data-id="${g.id}">
        <div class="gift-thumb" style="background-image:url('${g.image}')">
          ${!g.used ? `<div class="gift-dday ${cls}">${ddayLabel(diff)}</div>` : ''}
          ${g.used ? `<div class="used-stamp"><span>사용완료</span></div>` : ''}
        </div>
        <div class="gift-info">
          <div class="gift-brand">${escapeHtml(g.brand)}</div>
          <div class="gift-name">${escapeHtml(g.name)}</div>
        </div>
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.gift-card').forEach(card=>{
    card.addEventListener('click', ()=> openViewer(card.dataset.id));
  });
}

// ---- Add/Edit modal ----
function openAddModal(id){
  editingId = id || null;
  pendingImageData = null;
  $('addModalTitle').textContent = id ? '기프티콘 수정' : '기프티콘 추가';
  $('addDeleteBtn').style.display = id ? 'block' : 'none';
  if(id){
    const g = gifticons.find(x=>x.id===id);
    pendingImageData = g.image;
    $('imgPreview').style.backgroundImage = `url('${g.image}')`;
    $('imgPreview').textContent = '';
    $('f-brand').value = g.brand;
    $('f-name').value = g.name;
    $('f-expiry').value = g.expiry;
  } else {
    $('imgPreview').style.backgroundImage = '';
    $('imgPreview').textContent = '📷 눌러서 이미지 선택';
    $('f-brand').value = '';
    $('f-name').value = '';
    const today = getKSTToday();
    const oneYear = new Date(today); oneYear.setFullYear(oneYear.getFullYear()+1);
    $('f-expiry').value = `${oneYear.getFullYear()}-${String(oneYear.getMonth()+1).padStart(2,'0')}-${String(oneYear.getDate()).padStart(2,'0')}`;
  }
  $('addModalBackdrop').classList.add('open');
}
function closeAddModal(){
  $('addModalBackdrop').classList.remove('open');
  editingId = null;
}
const KNOWN_BRANDS = [
  '스타벅스','이디야','이디야커피','투썸플레이스','폴바셋','메가MGC커피','메가커피','컴포즈커피','빽다방','할리스',
  '커피빈','파스쿠찌','탐앤탐스','던킨','던킨도너츠','크리스피크림','파리바게뜨','뚜레쥬르',
  '배스킨라빈스','설빙','공차','스무디킹','쥬씨',
  'CU','GS25','세븐일레븐','이마트24','미니스톱',
  '교촌치킨','BBQ','굽네치킨','네네치킨','bhc','처갓집','맘스터치',
  '맥도날드','버거킹','롯데리아','KFC','서브웨이',
  '피자헛','도미노피자','미스터피자',
  '올리브영','다이소','이마트','홈플러스','롯데마트',
  '배달의민족','쿠팡','요기요','CGV','롯데시네마','메가박스'
];

const EXPIRY_KEYWORDS = ['유효기간','사용기한','교환기한','까지','만료일'];

function parseGifticonText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const fullText = lines.join(' ');

  // 브랜드 추정: 알려진 브랜드명이 텍스트에 포함되어 있는지 확인
  let brand = '';
  for(const b of KNOWN_BRANDS){
    if(fullText.includes(b)){ brand = b; break; }
  }

  // 유효기간 추정: "유효기간"류 키워드가 있는 줄(또는 바로 다음 줄) 우선, 없으면 전체에서 첫 날짜
  const dateRe = /(20\d{2})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})/;
  let expiry = '';
  for(let i=0; i<lines.length; i++){
    const line = lines[i];
    if(EXPIRY_KEYWORDS.some(k => line.includes(k))){
      let m = line.match(dateRe);
      if(!m && lines[i+1]) m = lines[i+1].match(dateRe); // 라벨과 날짜가 다른 줄에 있는 경우
      if(m){
        const mm = m[2].padStart(2,'0'), dd = m[3].padStart(2,'0');
        if(parseInt(mm,10)<=12 && parseInt(dd,10)<=31){
          expiry = `${m[1]}-${mm}-${dd}`;
          break;
        }
      }
    }
  }
  if(!expiry){
    for(const line of lines){
      const m = line.match(dateRe);
      if(m){
        const mm = m[2].padStart(2,'0'), dd = m[3].padStart(2,'0');
        if(parseInt(mm,10)<=12 && parseInt(dd,10)<=31){
          expiry = `${m[1]}-${mm}-${dd}`;
          break;
        }
      }
    }
  }

  // 상품명 추정: 카카오톡 선물하기 캡처는 "브랜드명 줄" 바로 다음 줄이 항상 상품명이라
  // 브랜드 줄의 위치를 기준으로 찾는 게 훨씬 정확함. 브랜드를 못 찾은 경우에만 다른 방식으로 대체.
  const noiseRe = /^\d+$/;
  const NOISE_WORDS = ['교환처','주문번호','카카오톡','선물하기','발행처','상품권','기프티콘','유효기간','사용기한'];
  function isNoiseLine(line){
    if(!line) return true;
    if(EXPIRY_KEYWORDS.some(k => line.includes(k))) return true;
    if(NOISE_WORDS.some(w => line.includes(w))) return true;
    if(dateRe.test(line)) return true;
    if(noiseRe.test(line.replace(/[\s-]/g,''))) return true;
    if(brand && line.trim() === brand) return true;
    if(line.length < 2 || line.length > 30) return true;
    return false;
  }

  let name = '';
  if(brand){
    // 브랜드명이 "단독으로" 등장하는 첫 줄(로고/헤더 표기)을 찾아 그 다음 줄부터 상품명으로 사용
    const brandLineIdx = lines.findIndex(l => l.trim() === brand);
    if(brandLineIdx !== -1){
      for(let i = brandLineIdx + 1; i < Math.min(brandLineIdx + 4, lines.length); i++){
        if(!isNoiseLine(lines[i])){
          name = lines[i];
          // 제목이 다음 줄로 이어지는 경우(줄바꿈) 자연스럽게 붙이기
          const cont = lines[i+1];
          if(cont && cont.length <= 12 && !isNoiseLine(cont)){
            name += cont;
          }
          break;
        }
      }
    }
  }

  // 브랜드를 못 찾았거나 위 방식으로 못 찾은 경우: 가장 그럴듯한(긴) 줄로 대체
  if(!name){
    const candidates = [];
    lines.forEach((line, idx) => {
      if(!isNoiseLine(line)) candidates.push({ line, idx });
    });
    candidates.sort((a,b)=> b.line.length - a.line.length);
    if(candidates.length){
      name = candidates[0].line;
      const nextLine = lines[candidates[0].idx + 1];
      if(nextLine && nextLine.length <= 12 && !isNoiseLine(nextLine)){
        name += nextLine;
      }
    }
  }

  return { brand, name, expiry };
}

// 상단 상품 사진 영역(글씨 노이즈 원인)을 잘라내고, 브랜드/제목/바코드가 있는
// 아래쪽 텍스트 영역만 OCR에 넘김
function cropBottomForOcr(file, topFraction){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const cropY = Math.round(img.height * topFraction);
        const cropH = img.height - cropY;
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = cropH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, cropY, img.width, cropH, 0, 0, img.width, cropH);
        canvas.toBlob((blob)=>{
          if(blob) resolve(blob); else reject(new Error('이미지 자르기에 실패했어요'));
        }, 'image/jpeg', 0.92);
      };
      img.onerror = () => reject(new Error('이미지를 읽지 못했어요'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽지 못했어요'));
    reader.readAsDataURL(file);
  });
}

async function runGifticonOcr(file){
  try{
    const croppedBlob = await cropBottomForOcr(file, 0.38);
    const { data: { text } } = await Tesseract.recognize(croppedBlob, 'kor+eng');
    const parsed = parseGifticonText(text);
    if(parsed.brand) $('f-brand').value = parsed.brand;
    if(parsed.name && !$('f-name').value) $('f-name').value = parsed.name;
    if(parsed.expiry) $('f-expiry').value = parsed.expiry;
    if(parsed.brand || parsed.name || parsed.expiry){
      showToast('✨ 자동으로 채웠어요, 확인 후 저장해주세요');
    }
  }catch(err){
    // 인식 실패해도 조용히 넘어감 - 수동 입력하면 되니까
  }
}

async function handleImageSelect(file){
  if(!file) return;
  try{
    $('imgPreview').textContent = '이미지 처리 중...';
    const dataUrl = await resizeImage(file, 1200, 0.9);
    pendingImageData = dataUrl;
    $('imgPreview').style.backgroundImage = `url('${dataUrl}')`;
    $('imgPreview').textContent = '';
    $('imgPreview').style.opacity = '0.6';
    runGifticonOcr(file).finally(()=>{ $('imgPreview').style.opacity = '1'; });
  }catch(err){
    showToast('이미지 처리에 실패했어요');
    $('imgPreview').textContent = '📷 눌러서 이미지 선택';
  }
}
async function saveGifticon(){
  const brand = $('f-brand').value.trim();
  const name = $('f-name').value.trim();
  const expiry = $('f-expiry').value;

  if(!brand || !name || !expiry){
    showToast('브랜드·기프티콘명·유효기간을 입력해주세요');
    return;
  }
  if(!pendingImageData){
    showToast('이미지를 선택해주세요');
    return;
  }

  const saveBtn = $('addSaveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = '이미지 업로드 중...';

  let imageUrl;
  try{
    imageUrl = await ensureImageUrl(pendingImageData);
  }catch(err){
    saveBtn.disabled = false;
    saveBtn.textContent = '저장';
    alert('⚠️ 이미지 업로드에 실패했어요\n\n' + (err.message || '') + '\n\n다시 시도해주세요.');
    return;
  }

  saveBtn.textContent = '저장 중...';

  // 실패 시 되돌리기 위해 이전 상태를 기억해둠
  const backup = JSON.parse(JSON.stringify(gifticons));
  let newId = editingId;
  if(editingId){
    const idx = gifticons.findIndex(g=>g.id===editingId);
    gifticons[idx] = { ...gifticons[idx], brand, name, expiry, image: imageUrl };
  } else {
    newId = 'g' + Date.now() + Math.floor(Math.random()*100000);
    gifticons.push({
      id: newId, brand, name, expiry, image: imageUrl,
      used: false, usedAt: null
    });
  }

  const ok = await saveGifticons();
  saveBtn.disabled = false;
  saveBtn.textContent = '저장';

  if(!ok){
    gifticons = backup; // 저장 실패 → 추가/수정 취소하고 이전 상태로 복구
    return; // 모달은 열어둔 채로 유지, 재시도 가능
  }
  render();
  closeAddModal();
  showToast('저장했어요');
}
async function deleteGifticon(){
  if(!editingId) return;
  const g = gifticons.find(x=>x.id===editingId);
  if(g && confirm(`'${g.brand} ${g.name}' 기프티콘을 삭제할까요? 되돌릴 수 없어요.`)){
    const backup = JSON.parse(JSON.stringify(gifticons));
    gifticons = gifticons.filter(x=>x.id!==editingId);
    const ok = await saveGifticons();
    if(!ok){ gifticons = backup; return; }
    render();
    closeAddModal();
    showToast('삭제했어요');
  }
}

// ---- Viewer modal ----
function openViewer(id){
  viewingId = id;
  const g = gifticons.find(x=>x.id===id);
  if(!g) return;
  $('viewerImg').src = g.image;
  $('viewerBrand').textContent = g.brand;
  $('viewerTitle').textContent = g.name;
  const diff = daysUntil(g.expiry);
  const cls = g.used ? 'ok' : statusClass(diff);
  $('viewerExpiryText').textContent = `유효기간 ${g.expiry}`;
  const badge = $('viewerDdayBadge');
  badge.textContent = g.used ? '사용완료' : ddayLabel(diff);
  badge.className = 'viewer-dday-badge ' + (g.used ? 'ok' : cls);
  $('viewerUseBtn').textContent = g.used ? '↩ 사용 취소' : '✅ 사용완료';
  $('viewerBackdrop').classList.add('open');
}
function closeViewer(){
  $('viewerBackdrop').classList.remove('open');
  viewingId = null;
}
async function toggleUsed(){
  const g = gifticons.find(x=>x.id===viewingId);
  if(!g) return;
  const prevUsed = g.used, prevUsedAt = g.usedAt;
  g.used = !g.used;
  g.usedAt = g.used ? new Date().toISOString() : null;
  const ok = await saveGifticons();
  if(!ok){ g.used = prevUsed; g.usedAt = prevUsedAt; return; }
  render();
  closeViewer();
  showToast(g.used ? '사용완료로 표시했어요' : '사용 취소했어요');
}

// ---- Backup ----
function downloadBackup(){
  const payload = { exportedAt: new Date().toISOString(), gifticons };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const t = getKSTToday();
  a.href = url;
  a.download = `기프티콘함_백업_${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('백업 파일을 다운로드했어요');
}

async function restoreBackup(file){
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data.gifticons)) throw new Error('형식이 올바르지 않아요');
      if(!confirm(`백업 파일에는 기프티콘 ${data.gifticons.length}개가 있어요. 지금 데이터를 이걸로 덮어쓸까요?`)) return;
      const backup = JSON.parse(JSON.stringify(gifticons));
      gifticons = data.gifticons;
      const ok = await saveGifticons();
      if(!ok){ gifticons = backup; return; }
      render();
      showToast('복원했어요');
    }catch(err){
      showToast('백업 파일을 읽을 수 없어요');
    }
  };
  reader.readAsText(file);
}

function init(){
  try{
    $('addBtn').addEventListener('click', ()=> openAddModal(null));
    $('addCancelBtn').addEventListener('click', closeAddModal);
    $('addSaveBtn').addEventListener('click', saveGifticon);
    $('addDeleteBtn').addEventListener('click', deleteGifticon);
    $('addModalBackdrop').addEventListener('click', e=>{ if(e.target.id==='addModalBackdrop') closeAddModal(); });
    $('imgPreview').addEventListener('click', ()=> $('f-image').click());
    $('f-image').addEventListener('change', e=> handleImageSelect(e.target.files[0]));

    $('viewerCloseBtn').addEventListener('click', closeViewer);
    $('viewerBackdrop').addEventListener('click', e=>{ if(e.target.id==='viewerBackdrop') closeViewer(); });
    $('viewerUseBtn').addEventListener('click', toggleUsed);
    $('viewerEditBtn').addEventListener('click', ()=>{ closeViewer(); openAddModal(viewingId); });

    document.querySelectorAll('#filterPills .pill').forEach(p=>{
      p.addEventListener('click', ()=>{ filter = p.dataset.filter; render(); });
    });

    $('backupDownloadBtn').addEventListener('click', downloadBackup);
    $('backupRestoreBtn').addEventListener('click', ()=> $('backupFileInput').click());
    $('backupFileInput').addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(file) restoreBackup(file);
      e.target.value = '';
    });

    loadGifticons();
  }catch(err){
    document.body.innerHTML = '<div style="padding:40px 20px;font-family:sans-serif;color:#C23B32;">화면을 불러오는 중 오류가 발생했어요.<br><br>' + String(err && err.message ? err.message : err) + '</div>';
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
