<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>댕탱 가계부</title>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css"></noscript>
<style>
  :root{
    --bg:#FFF8F3;
    --surface:#FFFFFF;
    --ink:#4A3B34;
    --ink-soft:#8A776C;
    --muted:#C4B2A6;
    --line:#F3E4D8;
    --accent:#D9A441;
    --accent-soft:#FBF0DC;
    --accent2:#6FCFC0;
    --accent2-soft:#E1F7F2;
    --blue:#6C8EEB;
    --blue-soft:#EAF0FF;
    --pink:#F27FAE;
    --pink-soft:#FFE7F3;
    --amber:#D9A441;
    --amber-soft:#FBF0DC;
    --red:#C23B32;
    --red-soft:#FBEAE8;
    --gray-soft:#F0EFEA;
    --radius:20px;
    --shadow:0 6px 18px -6px rgba(255,143,160,.22), 0 2px 6px -2px rgba(74,59,52,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  input, select, textarea{font-size:16px;}
  body{
    background:
      radial-gradient(circle at 8% 4%, #FCF3E0 0%, transparent 40%),
      radial-gradient(circle at 96% 12%, #E9F9F4 0%, transparent 38%),
      var(--bg);
    color:var(--ink);
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 70px 0;
  }
  .wrap{max-width:640px;margin:0 auto;padding:22px 16px 0;}

  /* Setup screen */
                
  header{margin-bottom:16px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;letter-spacing:.08em;color:var(--accent);
    text-transform:uppercase;font-weight:800;margin-bottom:8px;
    background:var(--accent-soft);padding:4px 11px;border-radius:100px;
  }
  h1{font-size:24px;font-weight:800;margin:0 0 4px;letter-spacing:-0.02em;}
  .sub{font-size:12.5px;color:var(--ink-soft);margin:0;line-height:1.6;}

  /* Month nav */
  .month-nav{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border-radius:16px;box-shadow:var(--shadow);
    padding:10px 8px;margin-top:14px;
  }
  .month-nav button{
    width:34px;height:34px;border-radius:10px;border:none;background:var(--gray-soft);
    color:var(--ink-soft);font-size:15px;cursor:pointer;
  }
  .month-nav .month-label{font-size:15px;font-weight:800;}

  /* Filter pills */
  .pill-row{display:flex;gap:6px;margin-top:10px;}
  .pill{
    flex:1;padding:8px 6px;border-radius:100px;border:1.5px solid var(--line);
    background:#fff;font-size:12.5px;font-weight:700;color:var(--ink-soft);
    cursor:pointer;transition:all .15s ease;text-align:center;
  }
  .pill.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .pill.active[data-owner="댕"]{background:var(--blue);border-color:var(--blue);}
  .pill.active[data-owner="탱"]{background:var(--pink);border-color:var(--pink);}
  .pill.active[data-owner="공용"]{background:var(--amber);border-color:var(--amber);}

  /* Summary card */
  .summary-card{
    background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px;margin-top:14px;
  }
  .summary-total{font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-bottom:2px;}
  .summary-amount{font-size:28px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
  .summary-compare{font-size:11.5px;font-weight:700;margin-top:4px;color:var(--ink-soft);}
  .summary-compare.up{color:var(--red);}
  .summary-compare.down{color:var(--accent2);}
  .summary-divider{border:none;border-top:1.5px dashed var(--line);margin:14px 0;}
  .income-net-row{display:flex;gap:10px;}
  .income-net-item{flex:1;}
  .summary-amount.income{font-size:20px;color:#2E8A78;}
  .summary-net-amount{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);}
  .summary-net-amount.plus{color:#2E8A78;}
  .summary-net-amount.minus{color:var(--red);}
  .summary-split{display:flex;gap:10px;margin-top:12px;}
  .summary-split-item{flex:1;background:var(--gray-soft);border-radius:12px;padding:10px 12px;}
  .summary-split-item.o-댕{background:var(--blue-soft);}
  .summary-split-item.o-탱{background:var(--pink-soft);}
  .summary-split-item.o-공용{background:var(--amber-soft);}
  .summary-split-label{font-size:11px;font-weight:800;color:var(--ink-soft);margin-bottom:2px;}
  .summary-split-amount{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
  .cat-bars{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
  .cat-bar-row{display:flex;align-items:center;gap:8px;font-size:12px;}
  .cat-bar-label{width:64px;flex-shrink:0;color:var(--ink-soft);font-weight:700;}
  .cat-bar-track{flex:1;height:8px;background:var(--gray-soft);border-radius:100px;overflow:hidden;}
  .cat-bar-fill{height:100%;background:var(--accent);border-radius:100px;}
  .cat-bar-amount{width:64px;flex-shrink:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-soft);}

  /* Add buttons */
  .add-row{display:flex;gap:8px;margin-top:14px;}
  .add-btn{
    flex:1;padding:13px;border-radius:100px;
    border:2px dashed #F3D9A8;background:var(--accent-soft);color:var(--accent);
    font-size:13px;font-weight:800;cursor:pointer;
  }
  .add-btn.ocr{border-color:var(--accent2);background:var(--accent2-soft);color:#3D9E8D;}
  .add-btn.expense{border-color:#F0B8B0;background:var(--red-soft);color:var(--red);}
  .add-btn.income{border-color:#9AD8CC;background:var(--accent2-soft);color:#2E8A78;}

  /* Section labels */
  .section-label{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;}
  .section-label h2{font-size:13.5px;font-weight:800;margin:0;}
  .toggle-icon{font-size:12px;color:var(--muted);transition:transform .2s ease;}
  .toggle-icon.open{transform:rotate(180deg);}
  .section-label .hint{font-size:11px;color:var(--muted);font-weight:700;}

  /* Entry list */
  .date-group{margin-bottom:14px;}
  .date-group-label{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-bottom:6px;padding-left:2px;}
  .entry-row{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border-radius:14px;box-shadow:var(--shadow);
    padding:12px 14px;margin-bottom:8px;cursor:pointer;
    border-left:4px solid transparent;
  }
  .entry-row.big-expense{border-left-color:var(--red);background:var(--red-soft);}
  .big-tag{
    display:inline-block;font-size:10px;font-weight:800;color:var(--red);
    background:#fff;border:1.5px solid var(--red);padding:1px 6px;border-radius:100px;
  }
  .entry-emoji{font-size:20px;flex-shrink:0;}
  .entry-body{flex:1;min-width:0;}
  .entry-detail{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px;}
  .entry-meta{font-size:11px;color:var(--ink-soft);}
  .entry-amount{font-size:14px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;flex-shrink:0;}
  .entry-amount.income{color:#2E8A78;}
  .entry-row.income-row{border-left:4px solid #6FCFC0;}
  .owner-tag{
    display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:100px;flex-shrink:0;
  }
  .owner-tag.o-댕{background:var(--blue-soft);color:#4C6FD6;}
  .owner-tag.o-탱{background:var(--pink-soft);color:#E0568F;}
  .owner-tag.o-공용{background:var(--amber-soft);color:var(--amber);}

  .empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:13px;}
  .empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px;}

  /* Trash */
  .trash-row{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border-radius:14px;box-shadow:var(--shadow);
    padding:10px 14px;margin-bottom:8px;opacity:.7;
  }
  .trash-body{flex:1;min-width:0;font-size:12.5px;}
  .trash-btn{
    border:1.5px solid var(--accent2);background:var(--accent2-soft);color:#3D9E8D;
    font-size:11px;font-weight:800;padding:5px 10px;border-radius:100px;cursor:pointer;flex-shrink:0;
  }
  .trash-del-btn{
    border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:3px;flex-shrink:0;
  }

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(74,59,52,.4);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--surface);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    animation:slideup .2s ease;
  }
  @media(min-width:540px){
    .modal-backdrop{align-items:center;}
    .modal{border-radius:24px;}
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal h3{margin:0 0 16px;font-size:16px;font-weight:800;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;
    font-family:inherit;background:#FFFCFA;color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--accent);}
  .cat-select-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .cat-select-btn{
    padding:8px 4px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
    font-size:11px;font-weight:700;color:var(--ink-soft);cursor:pointer;text-align:center;
  }
  .cat-select-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .cat-select-btn.add-cat{border-style:dashed;color:var(--accent);border-color:#F3D9A8;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .btn{flex:1;padding:12px;border-radius:100px;border:none;font-size:14px;font-weight:800;cursor:pointer;}
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.ghost{background:var(--gray-soft);color:var(--ink-soft);}
  .btn.danger{background:var(--red-soft);color:var(--red);}

  .ocr-status{text-align:center;padding:20px;font-size:13px;color:var(--ink-soft);}
  .ocr-row{
    display:flex;align-items:center;gap:8px;padding:10px;border:1.5px solid var(--line);
    border-radius:12px;margin-bottom:8px;
  }
  .ocr-row input[type="checkbox"]{width:18px;height:18px;flex-shrink:0;}
  .ocr-row-fields{flex:1;display:flex;flex-direction:column;gap:4px;}
  .ocr-row-fields input, .ocr-row-fields select{
    padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:#fff;
  }
  .ocr-row-fields .ocr-line1{display:flex;gap:4px;}
  .ocr-row-fields .ocr-line1 input:first-child{flex:0 0 90px;}
  .ocr-row-fields .ocr-line1 input:last-child{flex:1;}

  .footer-note{text-align:center;font-size:11px;color:var(--muted);margin-top:28px;line-height:1.7;}
  .backup-row{display:flex;gap:8px;margin-top:16px;justify-content:center;}
  .backup-link{
    background:none;border:none;color:var(--muted);font-size:11px;font-weight:700;
    cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:6px 4px;
  }
  .backup-link:hover{color:var(--ink-soft);}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:100px;
    font-size:12.5px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="wrap" id="mainWrap">
  <header>
    <div class="eyebrow">🏠 댕탱뭉 하우스 · 챕터 03</div>
    <h1>댕탱 가계부 💰</h1>
    <p class="sub">우리 둘의 지출 흐름을 한눈에</p>
  </header>

  <div class="month-nav">
    <button id="prevMonthBtn">◀</button>
    <span class="month-label" id="monthLabel">2026년 7월</span>
    <button id="nextMonthBtn">▶</button>
  </div>

  <div class="pill-row" id="ownerFilterPills">
    <button class="pill active" data-owner="all">전체</button>
    <button class="pill" data-owner="공용">공용</button>
    <button class="pill" data-owner="댕">댕</button>
    <button class="pill" data-owner="탱">탱</button>
  </div>

  <div class="summary-card">
    <div class="summary-total">이번 달 총 지출</div>
    <div class="summary-amount" id="summaryTotal">0원</div>
    <div class="summary-compare" id="summaryCompare"></div>
    <div class="summary-split">
      <div class="summary-split-item o-공용">
        <div class="summary-split-label">공용</div>
        <div class="summary-split-amount" id="summaryGongyong">0원</div>
      </div>
      <div class="summary-split-item o-댕">
        <div class="summary-split-label">댕</div>
        <div class="summary-split-amount" id="summaryDaeng">0원</div>
      </div>
      <div class="summary-split-item o-탱">
        <div class="summary-split-label">탱</div>
        <div class="summary-split-amount" id="summaryTaeng">0원</div>
      </div>
    </div>
    <hr class="summary-divider">
    <div class="income-net-row">
      <div class="income-net-item">
        <div class="summary-total">이번 달 총 수입</div>
        <div class="summary-amount income" id="summaryIncomeTotal">0원</div>
      </div>
      <div class="income-net-item">
        <div class="summary-total">순수익 (수입-지출)</div>
        <div class="summary-net-amount" id="summaryNet">0원</div>
      </div>
    </div>
    <div class="cat-bars" id="catBars"></div>
  </div>

  <div class="add-row">
    <button class="add-btn expense" id="addExpenseBtn">💸 지출 추가</button>
    <button class="add-btn income" id="addIncomeBtn">💰 수입 추가</button>
  </div>
  <div class="add-row">
    <button class="add-btn ocr" id="addOcrBtn" style="flex:1;">📷 캡처로 지출 추가</button>
  </div>
  <p style="font-size:11px;color:var(--muted);text-align:center;margin:8px 0 0;line-height:1.6;">📷 캡처 자동인식은 참고용이에요, 저장 전에 꼭 확인해주세요</p>

  <div class="section-label" id="searchToggle" style="cursor:pointer;">
    <h2>🔍 상세명 검색</h2>
    <span class="toggle-icon" id="searchToggleIcon">▾</span>
  </div>
  <div id="searchPanel" style="display:none;">
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <input type="text" id="searchInput" placeholder="예: 스타벅스" style="flex:1;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit;">
      <button class="add-btn" id="searchBtn" style="flex:0 0 auto;padding:0 16px;">검색</button>
    </div>
    <div id="searchResult"></div>
  </div>

  <div class="section-label">
    <h2>지출 내역</h2>
    <span class="hint" id="entryCountHint"></span>
  </div>
  <div id="entryList"></div>

  <div class="section-label" id="trashToggle" style="cursor:pointer;">
    <h2>🗑️ 휴지통</h2>
    <span class="hint" id="trashHint"></span>
  </div>
  <div id="trashList" style="display:none;"></div>

  <div class="backup-row">
    <button class="backup-link" id="backupDownloadBtn">⬇ 데이터 백업 다운로드</button>
    <button class="backup-link" id="backupRestoreBtn">⬆ 백업 파일 복원</button>
    <input type="file" id="backupFileInput" accept="application/json" style="display:none;">
  </div>

</div>

<div class="modal-backdrop" id="entryModalBackdrop">
  <div class="modal">
    <h3 id="entryModalTitle">지출 추가</h3>
    <div class="field">
      <label>담당자</label>
      <div class="cat-select-grid" id="f-owner-grid" style="grid-template-columns:repeat(3,1fr);"></div>
    </div>
    <div class="field">
      <label>날짜</label>
      <input type="date" id="f-date">
    </div>
    <div class="field">
      <label>가격 (원)</label>
      <input type="number" id="f-amount" placeholder="예: 12000" inputmode="numeric">
    </div>
    <div class="field">
      <label>카테고리</label>
      <div class="cat-select-grid" id="f-category-grid"></div>
    </div>
    <div class="field">
      <label>상세명</label>
      <input type="text" id="f-detail" placeholder="예: 스타벅스 코엑스점">
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="entryCancelBtn">취소</button>
      <button class="btn danger" id="entryDeleteBtn" style="display:none;">삭제</button>
      <button class="btn primary" id="entrySaveBtn">저장</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="ocrModalBackdrop">
  <div class="modal">
    <h3>캡처로 추가하기</h3>
    <div class="field" id="ocrUploadField">
      <label>지출 통장 캡처 화면을 올려주세요</label>
      <input type="file" id="ocrFileInput" accept="image/*">
      <p style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.6;">날짜·상세명·금액을 알아서 읽어봐요. 인식 후 꼭 확인하고 저장해주세요.</p>
    </div>
    <div id="ocrStatus" style="display:none;" class="ocr-status"></div>
    <div id="ocrResultWrap" style="display:none;">
      <div class="field">
        <label>담당자 (아래 항목 전체에 적용)</label>
        <select id="ocr-owner">
          <option value="댕">댕</option>
          <option value="탱">탱</option>
          <option value="공용">공용</option>
        </select>
      </div>
      <div id="ocrRows"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="ocrCancelBtn">취소</button>
      <button class="btn primary" id="ocrSaveBtn" style="display:none;">선택 항목 추가</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDhrAS_axfkAyBV7_JTTJOQdB6szw2_BXU",
    authDomain: "daengtaengmoonghouse.firebaseapp.com",
    projectId: "daengtaengmoonghouse",
    storageBucket: "daengtaengmoonghouse.firebasestorage.app",
    messagingSenderId: "656550962777",
    appId: "1:656550962777:web:8a9ae998f5a2c25448f348"
  };
  const fbApp = initializeApp(firebaseConfig);
  const db = getFirestore(fbApp);
  const DOC_ID = 'expense-ledger';

  window.firestoreLoad = async function(){
    const snap = await getDoc(doc(db, 'appdata', DOC_ID));
    return snap.exists() ? snap.data() : null;
  };
  window.firestoreSave = async function(data){
    await setDoc(doc(db, 'appdata', DOC_ID), data);
    return true;
  };
</script>
<script>
const CATEGORIES = [
  { key:'식비', emoji:'🍚' },
  { key:'카페', emoji:'☕' },
  { key:'교통', emoji:'🚌' },
  { key:'마트', emoji:'🛒' },
  { key:'통신', emoji:'📱' },
  { key:'구독', emoji:'📺' },
  { key:'문화생활', emoji:'🎬' },
  { key:'운동', emoji:'💪' },
  { key:'의료', emoji:'🏥' },
  { key:'차량', emoji:'🚗' },
  { key:'주거', emoji:'🏠' },
  { key:'경조사', emoji:'🎁' },
  { key:'부모님', emoji:'👨‍👩‍👧' },
  { key:'기타', emoji:'🗂️' }
];

const INCOME_CATEGORIES = [
  { key:'월급', emoji:'💼' },
  { key:'용돈', emoji:'🧧' },
  { key:'부수입', emoji:'💵' },
  { key:'환급/캐시백', emoji:'↩️' },
  { key:'이자/배당', emoji:'📈' },
  { key:'기타수입', emoji:'🗂️' }
];

function categoryListFor(type){
  const base = type === 'income' ? INCOME_CATEGORIES : CATEGORIES;
  const custom = customCategories.filter(c => (c.type || 'expense') === type);
  return [...base, ...custom];
}

function categoryEmoji(cat, type){
  const list = categoryListFor(type);
  const c = list.find(c => c.key === cat);
  if(c) return c.emoji;
  // 타입을 모를 때는 양쪽 다 확인
  const fallback = [...CATEGORIES, ...INCOME_CATEGORIES, ...customCategories].find(c => c.key === cat);
  return fallback ? fallback.emoji : '🗂️';
}

let entries = [];
let ownerFilter = 'all';
let currentMonth = '';
let editingId = null;
let selectedCategory = '식비';
let selectedOwner = '댕';
let currentEntryType = 'expense'; // 모달에서 지금 입력 중인 타입
let trashOpen = false;
const BIG_EXPENSE_THRESHOLD = 150000;
let ocrParsedRows = [];

const $ = (id) => document.getElementById(id);

function getKSTNow(){
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
}

function formatWon(n){
  return `${n.toLocaleString('ko-KR')}원`;
}

function monthKey(dateStr){
  return dateStr.slice(0,7);
}

function monthLabel(mk){
  const [y,m] = mk.split('-');
  return `${y}년 ${parseInt(m,10)}월`;
}

function shiftMonth(mk, delta){
  const [y,m] = mk.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- Firebase Firestore storage (no login, no token in source) ----

let customCategories = []; // [{key, emoji, type}]

async function loadEntries(){
  try{
    const data = await window.firestoreLoad();
    entries = (data && Array.isArray(data.entries)) ? data.entries : [];
    customCategories = (data && Array.isArray(data.customCategories)) ? data.customCategories : [];
  }catch(err){
    document.body.innerHTML = '<div style="padding:40px 20px;font-family:sans-serif;color:#C23B32;">데이터를 불러오지 못했어요.<br><br>' + String(err && err.message ? err.message : err) + '</div>';
    return;
  }
  try{
    render();
  }catch(err){
    document.body.innerHTML = '<div style="padding:40px 20px;font-family:sans-serif;color:#C23B32;">화면을 그리는 중 오류가 발생했어요.<br><br>' + String(err && err.message ? err.message : err) + '</div>';
  }
}

async function saveEntries(){
  try{
    await window.firestoreSave({ entries, customCategories });
    return true;
  }catch(e){
    alert('⚠️ 저장에 실패했어요!\n\n' + (e.message || '') + '\n\n방금 한 작업은 저장되지 않았어요. 인터넷 연결을 확인하고 다시 시도해주세요.');
    return false;
  }
}

// ---- Data helpers ----
function activeEntries(){
  return entries.filter(e => !e.deleted);
}
function deletedEntries(){
  return entries.filter(e => e.deleted);
}
function entryType(e){
  return e.type || 'expense'; // 기존 데이터(타입 없음)는 지출로 취급
}
function monthEntries(){
  return entriesForMonth(currentMonth);
}
function entriesForMonth(mk){
  let list = activeEntries().filter(e => monthKey(e.date) === mk);
  if(ownerFilter !== 'all') list = list.filter(e => e.owner === ownerFilter);
  return list;
}
function monthExpenseEntries(){
  return monthEntries().filter(e => entryType(e) === 'expense');
}
function monthIncomeEntries(){
  return monthEntries().filter(e => entryType(e) === 'income');
}

// ---- Render ----
function render(){
  $('monthLabel').textContent = monthLabel(currentMonth);
  document.querySelectorAll('#ownerFilterPills .pill').forEach(p=>{
    p.classList.toggle('active', p.dataset.owner === ownerFilter);
  });
  renderSummary();
  renderEntryList();
  renderTrash();
}

function renderSummary(){
  const list = monthExpenseEntries();
  const incomeList = monthIncomeEntries();
  const total = list.reduce((s,e)=>s+e.amount, 0);
  const incomeTotal = incomeList.reduce((s,e)=>s+e.amount, 0);
  const net = incomeTotal - total;
  const daengTotal = list.filter(e=>e.owner==='댕').reduce((s,e)=>s+e.amount, 0);
  const taengTotal = list.filter(e=>e.owner==='탱').reduce((s,e)=>s+e.amount, 0);
  const gongyongTotal = list.filter(e=>e.owner==='공용').reduce((s,e)=>s+e.amount, 0);
  $('summaryTotal').textContent = formatWon(total);
  $('summaryDaeng').textContent = formatWon(daengTotal);
  $('summaryTaeng').textContent = formatWon(taengTotal);
  $('summaryGongyong').textContent = formatWon(gongyongTotal);

  $('summaryIncomeTotal').textContent = formatWon(incomeTotal);
  const netEl = $('summaryNet');
  netEl.textContent = (net >= 0 ? '+' : '−') + formatWon(Math.abs(net));
  netEl.className = 'summary-net-amount ' + (net >= 0 ? 'plus' : 'minus');

  const prevMonth = shiftMonth(currentMonth, -1);
  const prevTotal = entriesForMonth(prevMonth).filter(e=>entryType(e)==='expense').reduce((s,e)=>s+e.amount, 0);
  const compareEl = $('summaryCompare');
  if(prevTotal === 0){
    compareEl.textContent = total > 0 ? '지난달 기록이 없어 비교할 수 없어요' : '';
    compareEl.className = 'summary-compare';
  } else {
    const diffPct = Math.round(((total - prevTotal) / prevTotal) * 100);
    if(diffPct > 0){
      compareEl.textContent = `📈 지난달보다 ${diffPct}% 더 썼어요`;
      compareEl.className = 'summary-compare up';
    } else if(diffPct < 0){
      compareEl.textContent = `📉 지난달보다 ${Math.abs(diffPct)}% 줄였어요`;
      compareEl.className = 'summary-compare down';
    } else {
      compareEl.textContent = `지난달이랑 지출이 똑같아요`;
      compareEl.className = 'summary-compare';
    }
  }

  const byCat = {};
  list.forEach(e=>{ byCat[e.category] = (byCat[e.category]||0) + e.amount; });
  const sorted = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxAmt = sorted.length ? sorted[0][1] : 1;

  if(sorted.length === 0){
    $('catBars').innerHTML = '<div style="font-size:12px;color:var(--muted);text-align:center;padding:8px 0;">아직 지출 내역이 없어요</div>';
  } else {
    $('catBars').innerHTML = sorted.map(([cat, amt])=>`
      <div class="cat-bar-row">
        <div class="cat-bar-label">${categoryEmoji(cat,'expense')} ${cat}</div>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${Math.max(4, amt/maxAmt*100)}%"></div></div>
        <div class="cat-bar-amount">${amt.toLocaleString('ko-KR')}</div>
      </div>
    `).join('');
  }
}

function renderEntryList(){
  const list = monthEntries().sort((a,b)=> b.date.localeCompare(a.date) || (b.id||'').localeCompare(a.id||''));
  $('entryCountHint').textContent = list.length ? `${list.length}건` : '';
  const container = $('entryList');

  if(list.length === 0){
    container.innerHTML = `<div class="empty"><b>이번 달 내역이 없어요</b>위 버튼으로 추가해보세요.</div>`;
    return;
  }

  const groups = {};
  list.forEach(e=>{
    if(!groups[e.date]) groups[e.date] = [];
    groups[e.date].push(e);
  });

  container.innerHTML = Object.keys(groups).sort().reverse().map(date=>{
    const [y,m,d] = date.split('-');
    const rows = groups[date].map(e=>{
      const isIncome = entryType(e) === 'income';
      const isBig = !isIncome && e.amount >= BIG_EXPENSE_THRESHOLD;
      return `
      <div class="entry-row ${isBig?'big-expense':''} ${isIncome?'income-row':''}" data-id="${e.id}">
        <span class="entry-emoji">${categoryEmoji(e.category, e.type)}</span>
        <div class="entry-body">
          <div class="entry-detail">
            <span class="owner-tag o-${escapeHtml(e.owner)}">${escapeHtml(e.owner)}</span>
            ${isBig ? '<span class="big-tag">⚠️ 큰 지출</span>' : ''}
            ${escapeHtml(e.detail || e.category)}
          </div>
          <div class="entry-meta">${escapeHtml(e.category)}</div>
        </div>
        <div class="entry-amount ${isIncome?'income':''}">${isIncome?'+':'−'}${e.amount.toLocaleString('ko-KR')}원</div>
      </div>
    `;
    }).join('');
    return `<div class="date-group"><div class="date-group-label">${parseInt(m,10)}월 ${parseInt(d,10)}일</div>${rows}</div>`;
  }).join('');

  container.querySelectorAll('.entry-row').forEach(row=>{
    row.addEventListener('click', ()=> openEntryModal(row.dataset.id));
  });
}

function renderTrash(){
  const list = deletedEntries().sort((a,b)=> (b.deletedAt||'').localeCompare(a.deletedAt||''));
  $('trashHint').textContent = list.length ? `${list.length}건` : '';
  const container = $('trashList');
  container.style.display = trashOpen ? 'block' : 'none';

  if(list.length === 0){
    container.innerHTML = `<div class="empty"><b>휴지통이 비어있어요</b></div>`;
    return;
  }
  container.innerHTML = list.map(e=>`
    <div class="trash-row">
      <span class="owner-tag o-${escapeHtml(e.owner)}">${escapeHtml(e.owner)}</span>
      <div class="trash-body">${escapeHtml(e.detail||e.category)} · ${e.amount.toLocaleString('ko-KR')}원 · ${escapeHtml(e.date)}</div>
      <button class="trash-btn" data-restore="${e.id}">↩ 복원</button>
      <button class="trash-del-btn" data-permadel="${e.id}" title="완전 삭제">✕</button>
    </div>
  `).join('');
  container.querySelectorAll('[data-restore]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const entry = entries.find(e=>e.id===btn.dataset.restore);
      if(!entry) return;
      entry.deleted = false; delete entry.deletedAt;
      const ok = await saveEntries();
      if(!ok){ entry.deleted = true; entry.deletedAt = new Date().toISOString(); return; }
      render(); showToast('복원했어요');
    });
  });
  container.querySelectorAll('[data-permadel]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const entry = entries.find(e=>e.id===btn.dataset.permadel);
      if(entry && confirm(`'${entry.detail||entry.category}' 항목을 완전히 삭제할까요? 되돌릴 수 없어요.`)){
        const backup = JSON.parse(JSON.stringify(entries));
        entries = entries.filter(e=>e.id!==btn.dataset.permadel);
        const ok = await saveEntries();
        if(!ok){ entries = backup; return; }
        render(); showToast('완전히 삭제했어요');
      }
    });
  });
}

// ---- Entry modal ----
function renderCategoryGrid(){
  const list = categoryListFor(currentEntryType);
  $('f-category-grid').innerHTML = list.map(c=>`
    <button type="button" class="cat-select-btn ${c.key===selectedCategory?'active':''}" data-cat="${c.key}">${c.emoji} ${c.key}</button>
  `).join('') + `<button type="button" class="cat-select-btn add-cat" id="addCategoryBtn">➕ 추가</button>`;
  $('f-category-grid').querySelectorAll('.cat-select-btn[data-cat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedCategory = btn.dataset.cat;
      $('f-category-grid').querySelectorAll('.cat-select-btn[data-cat]').forEach(b=>b.classList.toggle('active', b===btn));
    });
  });
  $('addCategoryBtn').addEventListener('click', addCustomCategory);
}

async function addCustomCategory(){
  const raw = prompt('추가할 카테고리 이름을 입력해주세요\n(예: 반려동물, 자기계발)');
  if(!raw) return;
  const name = raw.trim();
  if(!name) return;
  if(name.length > 8){
    showToast('카테고리 이름은 8자 이내로 입력해주세요');
    return;
  }
  const exists = categoryListFor(currentEntryType).some(c => c.key === name);
  if(exists){
    selectedCategory = name;
    renderCategoryGrid();
    return;
  }
  customCategories.push({ key: name, emoji: '🏷️', type: currentEntryType });
  selectedCategory = name;
  const ok = await saveEntries(); // customCategories도 함께 저장됨
  if(!ok){
    customCategories = customCategories.filter(c => c.key !== name || c.type !== currentEntryType);
    return;
  }
  renderCategoryGrid();
  showToast(`'${name}' 카테고리를 추가했어요`);
}

const OWNER_EMOJI = { '댕':'🔵', '탱':'🌸', '공용':'🟡' };
function renderOwnerGrid(){
  $('f-owner-grid').innerHTML = ['댕','탱','공용'].map(o=>`
    <button type="button" class="cat-select-btn ${o===selectedOwner?'active':''}" data-owner-pick="${o}">${OWNER_EMOJI[o]} ${o}</button>
  `).join('');
  $('f-owner-grid').querySelectorAll('.cat-select-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedOwner = btn.dataset.ownerPick;
      $('f-owner-grid').querySelectorAll('.cat-select-btn').forEach(b=>b.classList.toggle('active', b===btn));
    });
  });
}

function openEntryModal(id, type){
  editingId = id || null;
  if(id){
    const e = entries.find(x=>x.id===id);
    currentEntryType = e.type || 'expense';
  } else {
    currentEntryType = type || 'expense';
  }
  const typeLabel = currentEntryType === 'income' ? '수입' : '지출';
  $('entryModalTitle').textContent = id ? `${typeLabel} 수정` : `${typeLabel} 추가`;
  $('entryDeleteBtn').style.display = id ? 'block' : 'none';
  const now = getKSTNow();
  if(id){
    const e = entries.find(x=>x.id===id);
    selectedOwner = e.owner;
    $('f-date').value = e.date;
    $('f-amount').value = e.amount;
    selectedCategory = e.category;
    $('f-detail').value = e.detail || '';
  } else {
    selectedOwner = ownerFilter !== 'all' && ownerFilter !== 'income-all' ? ownerFilter : '댕';
    $('f-date').value = `${currentMonth}-${String(now.getDate()).padStart(2,'0')}`;
    $('f-amount').value = '';
    selectedCategory = categoryListFor(currentEntryType)[0].key;
    $('f-detail').value = '';
  }
  renderOwnerGrid();
  renderCategoryGrid();
  $('entryModalBackdrop').classList.add('open');
}
function closeEntryModal(){
  $('entryModalBackdrop').classList.remove('open');
  editingId = null;
}
async function saveEntry(){
  const owner = selectedOwner;
  const date = $('f-date').value;
  const amount = parseInt($('f-amount').value, 10);
  const detail = $('f-detail').value.trim();

  if(!date || !amount || amount <= 0){
    showToast('날짜와 가격을 확인해주세요');
    return;
  }

  const saveBtn = $('entrySaveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = '저장 중...';

  const backup = JSON.parse(JSON.stringify(entries));
  if(editingId){
    const idx = entries.findIndex(e=>e.id===editingId);
    entries[idx] = { ...entries[idx], owner, date, amount, category: selectedCategory, detail, type: currentEntryType };
  } else {
    entries.push({
      id: 'e' + Date.now() + Math.floor(Math.random()*100000),
      owner, date, amount, category: selectedCategory, detail, type: currentEntryType,
      deleted: false, deletedAt: null
    });
  }
  const ok = await saveEntries();
  saveBtn.disabled = false;
  saveBtn.textContent = '저장';
  if(!ok){ entries = backup; return; }

  currentMonth = monthKey(date);
  render();
  closeEntryModal();
  showToast('저장했어요');
}
async function deleteEntry(){
  if(!editingId) return;
  const entry = entries.find(e=>e.id===editingId);
  if(entry && confirm(`'${entry.detail||entry.category}' 항목을 휴지통으로 보낼까요?`)){
    entry.deleted = true;
    entry.deletedAt = new Date().toISOString();
    const ok = await saveEntries();
    if(!ok){ entry.deleted = false; delete entry.deletedAt; return; }
    render();
    closeEntryModal();
    showToast('휴지통으로 보냈어요');
  }
}

const OCR_NOISE_LABELS = [
  '결제수단','총 상품가격','총상품가격','배송비','총 결제금액','총결제금액',
  '장바구니 담기','배송 조회','교환','반품','리뷰 작성하기','받는사람','연락처',
  '받는주소','배송요청사항','결제 정보','받는사람 정보','일시불'
];

function parseBankText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  // 우선순위 1: "2026. 7. 10" 처럼 4자리 연도가 포함된 전체 날짜
  const fullDateRe = /(20\d{2})\D{1,3}(\d{1,2})\D{1,3}(\d{1,2})/;
  // 우선순위 2: "7/13", "07.10" 처럼 월.일만 있는 짧은 날짜
  const shortDateRe = /(?:^|[^\d])(\d{1,2})\s?[.\/]\s?(\d{1,2})\s?일?(?!\d)/;
  const amountRe = /([+-]?\s?[\d,]{3,})\s?원/;
  const amountCommaRe = /([+-]?\s?\d{1,3}(?:,\d{3})+)/;
  const now = getKSTNow();
  const year = now.getFullYear();
  const results = [];
  let lastDate = `${year}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  let hasFullDate = false;

  lines.forEach((line, idx) => {
    const fullMatch = line.match(fullDateRe);
    if(fullMatch){
      const yy = fullMatch[1];
      const mm = fullMatch[2].padStart(2,'0');
      const dd = fullMatch[3].padStart(2,'0');
      if(parseInt(mm,10) <= 12 && parseInt(dd,10) <= 31){
        lastDate = `${yy}-${mm}-${dd}`;
        hasFullDate = true; // 이후엔 짧은 날짜(배송일 등)로 덮어쓰지 않음
      }
    } else if(!hasFullDate){
      const shortMatch = line.match(shortDateRe);
      if(shortMatch){
        const mm = shortMatch[1].padStart(2,'0');
        const dd = shortMatch[2].padStart(2,'0');
        if(parseInt(mm,10) <= 12 && parseInt(dd,10) <= 31){
          lastDate = `${year}-${mm}-${dd}`;
        }
      }
    }

    const aMatch = line.match(amountRe) || line.match(amountCommaRe);
    if(aMatch){
      const amountNum = parseInt(aMatch[1].replace(/[^\d]/g,''), 10);
      if(!isNaN(amountNum) && amountNum >= 100){
        let merchant = line.replace(fullDateRe,'').replace(shortDateRe,'').replace(amountRe,'').replace(amountCommaRe,'').replace(/[-+]/g,'').replace(/\d+\s?개/g,'').replace(/[·•]/g,'').trim();
        let isNoise = OCR_NOISE_LABELS.some(label => merchant.includes(label)) || merchant.length < 2;
        // 상품명이 금액과 다른 줄에 있는 경우, 바로 윗줄을 상세명 후보로 사용
        if(isNoise && idx > 0){
          const prevLine = lines[idx - 1];
          if(prevLine && !amountRe.test(prevLine) && !fullDateRe.test(prevLine) && prevLine.length >= 2){
            const prevIsNoise = OCR_NOISE_LABELS.some(label => prevLine.includes(label));
            if(!prevIsNoise){
              merchant = prevLine;
              isNoise = false;
            }
          }
        }
        // 바로 앞 항목과 날짜·금액이 완전히 같으면 같은 거래를 중복으로 읽은 것으로 보고 건너뜀
        const prev = results[results.length - 1];
        const isDuplicate = prev && prev.date === lastDate && prev.amount === amountNum;
        if(isDuplicate){
          if(!isNoise && (!prev.detail || prev.detail.length < merchant.length)){
            prev.detail = merchant; // 더 그럴듯한 이름으로 교체
          }
          return;
        }
        results.push({ date: lastDate, amount: amountNum, detail: isNoise ? '' : merchant, category: '기타' });
      }
    }
  });
  return results;
}

function renderOcrRows(){
  $('ocrRows').innerHTML = ocrParsedRows.map((r, i)=>`
    <div class="ocr-row">
      <input type="checkbox" data-ocr-check="${i}" checked>
      <div class="ocr-row-fields">
        <div class="ocr-line1">
          <input type="date" data-ocr-date="${i}" value="${r.date}">
          <input type="number" data-ocr-amount="${i}" value="${r.amount}">
        </div>
        <input type="text" data-ocr-detail="${i}" value="${escapeHtml(r.detail)}" placeholder="상세명">
        <select data-ocr-category="${i}">
          ${CATEGORIES.map(c=>`<option value="${c.key}" ${c.key===r.category?'selected':''}>${c.emoji} ${c.key}</option>`).join('')}
        </select>
      </div>
    </div>
  `).join('');
  $('ocrRows').querySelectorAll('[data-ocr-date]').forEach(el=>el.addEventListener('change', e=>{ ocrParsedRows[+e.target.dataset.ocrDate].date = e.target.value; }));
  $('ocrRows').querySelectorAll('[data-ocr-amount]').forEach(el=>el.addEventListener('change', e=>{ ocrParsedRows[+e.target.dataset.ocrAmount].amount = parseInt(e.target.value,10)||0; }));
  $('ocrRows').querySelectorAll('[data-ocr-detail]').forEach(el=>el.addEventListener('change', e=>{ ocrParsedRows[+e.target.dataset.ocrDetail].detail = e.target.value; }));
  $('ocrRows').querySelectorAll('[data-ocr-category]').forEach(el=>el.addEventListener('change', e=>{ ocrParsedRows[+e.target.dataset.ocrCategory].category = e.target.value; }));
}

async function handleOcrFile(file){
  if(!file) return;
  $('ocrUploadField').style.display = 'none';
  $('ocrStatus').style.display = 'block';
  $('ocrStatus').textContent = '📷 글자를 읽는 중이에요... (몇 초 걸릴 수 있어요)';
  try{
    const { data: { text } } = await Tesseract.recognize(file, 'kor+eng');
    ocrParsedRows = parseBankText(text);
    $('ocrStatus').style.display = 'none';
    if(ocrParsedRows.length === 0){
      $('ocrStatus').style.display = 'block';
      $('ocrStatus').innerHTML = '인식된 내역이 없어요 😢<br>직접 입력으로 추가해주세요.';
      return;
    }
    $('ocrResultWrap').style.display = 'block';
    $('ocrSaveBtn').style.display = 'block';
    renderOcrRows();
  }catch(err){
    $('ocrStatus').style.display = 'block';
    $('ocrStatus').innerHTML = '<span style="color:var(--red);">인식에 실패했어요: ' + (err && err.message ? err.message : err) + '</span>';
  }
}

async function saveOcrRows(){
  const owner = $('ocr-owner').value;
  const checks = $('ocrRows').querySelectorAll('[data-ocr-check]');
  const backup = JSON.parse(JSON.stringify(entries));
  let count = 0;
  checks.forEach(chk=>{
    if(chk.checked){
      const r = ocrParsedRows[+chk.dataset.ocrCheck];
      if(r.date && r.amount > 0){
        entries.push({
          id: 'e' + Date.now() + Math.floor(Math.random()*100000) + count,
          owner, date: r.date, amount: r.amount, category: r.category, detail: r.detail, type: 'expense',
          deleted: false, deletedAt: null
        });
        count++;
      }
    }
  });
  if(count === 0){
    showToast('선택된 항목이 없어요');
    return;
  }
  const ok = await saveEntries();
  if(!ok){ entries = backup; return; }
  render();
  closeOcrModal();
  showToast(`${count}개 항목을 추가했어요`);
}

// ---- Init & events ----
// ---- Search ----
function runSearch(){
  const q = $('searchInput').value.trim();
  const resultEl = $('searchResult');
  if(!q){
    resultEl.innerHTML = '';
    return;
  }
  const matches = activeEntries().filter(e =>
    (e.detail || '').includes(q) || (e.category || '').includes(q)
  ).sort((a,b)=> b.date.localeCompare(a.date));

  if(matches.length === 0){
    resultEl.innerHTML = `<div class="empty"><b>검색 결과가 없어요</b></div>`;
    return;
  }
  const total = matches.reduce((s,e)=>s+e.amount, 0);
  resultEl.innerHTML =
    `<div style="font-size:13px;font-weight:800;margin-bottom:8px;">'${escapeHtml(q)}' 검색 결과 ${matches.length}건 · ${formatWon(total)}</div>` +
    matches.map(e=>{
      const isIncome = entryType(e) === 'income';
      return `
      <div class="entry-row ${isIncome?'income-row':''}" data-id="${e.id}">
        <span class="entry-emoji">${categoryEmoji(e.category, e.type)}</span>
        <div class="entry-body">
          <div class="entry-detail">
            <span class="owner-tag o-${escapeHtml(e.owner)}">${escapeHtml(e.owner)}</span>
            ${escapeHtml(e.detail || e.category)}
          </div>
          <div class="entry-meta">${escapeHtml(e.date)} · ${escapeHtml(e.category)}</div>
        </div>
        <div class="entry-amount ${isIncome?'income':''}">${isIncome?'+':'−'}${e.amount.toLocaleString('ko-KR')}원</div>
      </div>
    `;
    }).join('');
  resultEl.querySelectorAll('.entry-row').forEach(row=>{
    row.addEventListener('click', ()=> openEntryModal(row.dataset.id));
  });
}

// ---- Backup ----
function downloadBackup(){
  const payload = { exportedAt: new Date().toISOString(), entries };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const t = getKSTNow();
  a.href = url;
  a.download = `댕탱가계부_백업_${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('백업 파일을 다운로드했어요');
}

function restoreBackup(file){
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data.entries)) throw new Error('형식이 올바르지 않아요');
      if(!confirm(`백업 파일에는 항목 ${data.entries.length}개가 있어요. 지금 데이터를 이걸로 덮어쓸까요?`)) return;
      const backup = JSON.parse(JSON.stringify(entries));
      entries = data.entries;
      const ok = await saveEntries();
      if(!ok){ entries = backup; return; }
      render();
      showToast('복원했어요');
    }catch(err){
      showToast('백업 파일을 읽을 수 없어요');
    }
  };
  reader.readAsText(file);
}

function init(){
  try{
    const now = getKSTNow();
    currentMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

    $('prevMonthBtn').addEventListener('click', ()=>{ currentMonth = shiftMonth(currentMonth, -1); render(); });
    $('nextMonthBtn').addEventListener('click', ()=>{ currentMonth = shiftMonth(currentMonth, 1); render(); });

    document.querySelectorAll('#ownerFilterPills .pill').forEach(p=>{
      p.addEventListener('click', ()=>{ ownerFilter = p.dataset.owner; render(); });
    });

    $('addExpenseBtn').addEventListener('click', ()=> openEntryModal(null, 'expense'));
    $('addIncomeBtn').addEventListener('click', ()=> openEntryModal(null, 'income'));
    $('entryCancelBtn').addEventListener('click', closeEntryModal);
    $('entrySaveBtn').addEventListener('click', saveEntry);
    $('entryDeleteBtn').addEventListener('click', deleteEntry);
    $('entryModalBackdrop').addEventListener('click', e=>{ if(e.target.id==='entryModalBackdrop') closeEntryModal(); });

    $('addOcrBtn').addEventListener('click', openOcrModal);
    $('ocrCancelBtn').addEventListener('click', closeOcrModal);
    $('ocrSaveBtn').addEventListener('click', saveOcrRows);
    $('ocrFileInput').addEventListener('change', e=> handleOcrFile(e.target.files[0]));
    $('ocrModalBackdrop').addEventListener('click', e=>{ if(e.target.id==='ocrModalBackdrop') closeOcrModal(); });

    $('trashToggle').addEventListener('click', ()=>{ trashOpen = !trashOpen; renderTrash(); });

    $('searchToggle').addEventListener('click', ()=>{
      const panel = $('searchPanel');
      const icon = $('searchToggleIcon');
      const isOpen = panel.style.display !== 'none';
      panel.style.display = isOpen ? 'none' : 'block';
      icon.classList.toggle('open', !isOpen);
    });
    $('searchBtn').addEventListener('click', runSearch);
    $('searchInput').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') runSearch(); });

    $('backupDownloadBtn').addEventListener('click', downloadBackup);
    $('backupRestoreBtn').addEventListener('click', ()=> $('backupFileInput').click());
    $('backupFileInput').addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(file) restoreBackup(file);
      e.target.value = '';
    });

    loadEntries();
  }catch(err){
    document.body.innerHTML = '<div style="padding:40px 20px;font-family:sans-serif;color:#C23B32;">화면을 불러오는 중 오류가 발생했어요.<br><br>' + String(err && err.message ? err.message : err) + '</div>';
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
